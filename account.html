<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/img/favicon.png?v=pro">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=pro">
<title>Account — MyFlipbook</title>
<script src="assets/i18n.js"></script>
<link rel="stylesheet" href="assets/ui-clay.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  body{margin:0;min-height:100dvh;background:#FBFAF7;color:#1C1917}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:-1;
    background:radial-gradient(700px 420px at 50% 0%,#EDF3E4 0%,transparent 60%),radial-gradient(600px 500px at 95% 30%,#F3EFE6 0%,transparent 55%)}
  .wrap{max-width:1100px;margin:0 auto;padding:12px 16px 56px}
  .nav-right{display:flex;align-items:center;gap:8px}
  .lang{border:1px solid #E8E2D4;background:#E9E4FF;border-radius:999px;padding:7px 12px;font-weight:800;font-size:12px;cursor:pointer}
  h1{margin:32px 0 16px;font-size:32px}
  h2{margin:0 0 12px;font-size:21px}
  .profile{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px}
  .who b{display:block;font-size:17px}
  .who span{font-size:13px}
  .verified{display:inline-block;margin-left:8px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#E6F4EA;color:#1E7A3C;white-space:nowrap}
  .verified.no{background:#FFF7ED;color:#9A3412}
  .plan-now{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
  .chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:#E4F3C2;color:#1A3C34}
  .chip.paid{background:#1A3C34;color:#FFF7EA}
  .notice{margin:16px 0 0;padding:14px 16px;border-radius:16px;font-size:13px;line-height:1.5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .notice.info{background:#1A3C34;color:#FFF7EA}
  .notice.warn{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412}
  .notice.ok{background:#EFF6EC;border:1px solid #BBD8B0;color:#1A3C34}
  .notice.err{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C}
  section{margin-top:28px}
  .head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
  .method{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800}
  .method select{border:1px solid #E4DED0;border-radius:999px;padding:8px 12px;background:#fff;font:700 12px 'Plus Jakarta Sans',sans-serif;max-width:260px}
  /* Plans: the price list's design (Paket & Harga) */
  #plansSection .phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  #plansSection .ptitle{margin:0;font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:30px;letter-spacing:-.4px;line-height:1.1}
  #plansSection .switches{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #plansSection .cycle{display:flex;padding:4px;gap:4px;background:#fff;border:1px solid #E5E0D8;border-radius:999px}
  #plansSection .cycle button{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:999px;font:600 14px 'Plus Jakarta Sans',sans-serif;cursor:pointer;background:transparent;color:#1C1A17}
  #plansSection .cycle button:hover{color:#5F5A52}
  #plansSection .cycle button.on{background:#1C1A17;color:#fff}
  #plansSection .cycle b{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#FDECEC;color:#B00808}
  #plansSection .cycle b:empty{display:none}
  #plansSection .cycle button.on b{background:#fff}
  #plansSection .method{display:flex;align-items:center;gap:8px;font:600 14px 'Plus Jakarta Sans',sans-serif;color:#1C1A17}
  #plansSection .method select{min-height:48px;border:1px solid #E5E0D8;border-radius:999px;padding:0 16px;background:#fff;font:600 14px 'Plus Jakarta Sans',sans-serif;color:#1C1A17;max-width:260px;cursor:pointer}
  .plans3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:stretch}
  .plans3 .plan{display:flex;flex-direction:column;padding:32px 28px 28px;background:#fff;border:1px solid #E5E0D8;border-radius:20px;color:#1C1A17;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .plans3 .plan:not(.hot){margin:1px}
  .plans3 .plan.hot{border:2px solid #D40B0B;box-shadow:0 12px 32px rgba(28,26,23,.10)}
  .plans3 .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px}
  .plans3 h3{margin:0;font:600 22px 'Plus Jakarta Sans',sans-serif}
  .plans3 .badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .plans3 .badge{font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:999px;background:#FDECEC;color:#B00808;white-space:nowrap}
  .plans3 .badge.mine{background:#1C1A17;color:#fff}
  .plans3 .pd{margin:8px 0 0;font-size:14px;line-height:1.45;color:#5F5A52;min-height:40px}
  .plans3 .pp{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;margin-top:20px}
  .plans3 .big{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.1}
  .plans3 .per{font-size:15px;color:#5F5A52}
  .plans3 .was{font-size:16px;font-weight:700;color:#A8A29E}
  .plans3 .pn{margin:6px 0 0;font-size:13px;line-height:1.45;color:#5F5A52;min-height:38px}
  .plans3 ul{list-style:none;margin:18px 0 28px;padding:0;display:flex;flex-direction:column;gap:10px}
  .plans3 li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
  .plans3 li svg{flex:none;margin-top:1px;color:#1C1A17}.plans3 .plan.hot li svg{color:#D40B0B}
  .plans3 .pc{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:auto;border:0;border-radius:999px;font:700 15px 'Plus Jakarta Sans',sans-serif;color:#fff;background:#1C1A17;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
  .plans3 .plan.hot .pc{background:#D40B0B}
  .plans3 .pc:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 22px rgba(28,26,23,.18);color:#fff}
  .plans3 .pc:disabled{background:#F3F0EA!important;color:#78716C;cursor:default}
  .plans3 .renew{margin-top:10px;border:0;background:none;font:700 13px 'Plus Jakarta Sans',sans-serif;color:#5F5A52;text-decoration:underline;cursor:pointer;align-self:center}
  .plans3 .renew:hover:not(:disabled){color:#D40B0B}
  .plans3 .renew:disabled{opacity:.5;cursor:default}
  @media (max-width:900px){.plans3{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #EFE9DC}
  th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#78716C}
  .orders{padding:6px 8px;overflow-x:auto}
  .usage{padding:16px 22px;margin:18px 0}
  .usage h2{margin:0 0 8px;font-size:17px}
  .usage .row{display:grid;grid-template-columns:150px 1fr 220px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
  .usage .bar{height:8px;border-radius:999px;background:#f1ece2;overflow:hidden}
  .usage .bar span{display:block;height:100%;background:#1a3c34;border-radius:999px}
  .usage .bar span.low{background:#e8590c}
  @media (max-width:560px){.usage .row{grid-template-columns:1fr;gap:4px}}
  .referral{padding:18px 22px;margin:18px 0}
  .referral h2{margin:0 0 4px;font-size:18px}
  .referral .ref-link{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
  .referral .ref-link input{flex:1;min-width:220px;padding:9px 12px;border:1.5px solid #1c1917;border-radius:12px;font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif;background:#fff}
  .referral .bar{height:10px;border-radius:999px;background:#f1ece2;overflow:hidden;margin:6px 0}
  .referral .bar span{display:block;height:100%;background:linear-gradient(90deg,#ff5c28,#c026d3);border-radius:999px}
  .referral .stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
  .referral .stats b{font-size:16px}
  .invoice-link{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #E4DED0;background:#fff;color:#1A3C34;font-weight:800;font-size:11.5px;text-decoration:none;white-space:nowrap}
  .invoice-link:hover{background:#EFF6EC}
  button.invoice-link{cursor:pointer;font-family:inherit}
  .invoice-tools{display:inline-flex;gap:6px;flex-wrap:wrap}
  .fine{font-size:11.5px;margin-top:8px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header data-site-header><a href="library.html" class="clay-btn clay-btn-ghost" style="padding:8px 16px;font-size:12px">📚 My Library</a></header>

  <h1 class="clay-h" id="pageTitle" data-i18n="acct.title">Your account</h1>
  <div class="clay-panel profile" id="profile" hidden>
    <div class="who"><b id="who"></b><span class="clay-muted" id="email"></span><span class="verified" id="verified" hidden></span></div>
    <div class="plan-now">
      <span class="clay-muted" data-i18n="acct.plan">Current plan</span> <span class="chip" id="planChip"></span>
      <span class="clay-muted" id="until"></span>
      <button class="clay-btn clay-btn-ghost" id="logout" type="button" data-i18n="acct.logout">Log out</button>
    </div>
  </div>
  <div id="notice"></div>
  <div class="clay-panel usage" id="usage" hidden>
    <h2 class="clay-h" id="usageTitle"></h2>
    <div id="usageRows"></div>
  </div>
  <div class="clay-panel referral" id="referral" hidden>
    <h2 class="clay-h" data-i18n="ref.title">Invite friends, get Medium free</h2>
    <p class="clay-muted" id="refRule"></p>
    <div class="ref-link"><input id="refLink" readonly aria-label="Referral link"><button type="button" class="clay-btn clay-btn-dark" id="refCopy" data-i18n="ref.copy">Copy link</button></div>
    <div class="bar"><span id="refBar" style="width:0%"></span></div>
    <p class="clay-muted" id="refNext"></p>
    <div class="stats"><span><b id="refSignups">0</b> <span data-i18n="ref.signups">signed up</span></span><span><b id="refSubscribed">0</b> <span data-i18n="ref.subscribed">subscribed</span></span><span><b id="refRewards">0</b> <span data-i18n="ref.rewards">months earned</span></span></div>
  </div>

  <section id="plansSection">
    <div class="phead">
      <h2 class="ptitle" data-i18n="acct.plans">Plans</h2>
      <div class="switches">
        <label class="method" id="methodBox" hidden><span data-i18n="acct.method">Payment method</span> <select id="method"></select></label>
        <div class="cycle" role="group" aria-label="Currency">
          <button type="button" data-currency="IDR">Rp</button>
          <button type="button" data-currency="USD">$ USD</button>
        </div>
        <div class="cycle" role="group" aria-label="Periode pembayaran">
          <button type="button" data-cycle="monthly" class="on"><span data-i18n="acct.monthly">Monthly</span></button>
          <button type="button" data-cycle="yearly"><span data-i18n="acct.yearly">Yearly</span><b id="saveBadge"></b></button>
        </div>
      </div>
    </div>
    <div class="plans3" id="plans"></div>
    <p class="fine clay-muted" data-i18n="acct.draft">Rupiah (QRIS, bank transfer, e-wallet) for Indonesia; US dollars (card, PayPal) everywhere else.</p>
  </section>

  <section id="ordersSection">
    <h2 class="clay-h" data-i18n="acct.orders">Payment history</h2>
    <div class="clay-panel orders"><table>
      <thead><tr><th data-i18n="acct.colDate">Date</th><th data-i18n="acct.colPlan">Plan</th><th data-i18n="acct.colAmount">Amount</th><th data-i18n="acct.colStatus">Status</th><th data-i18n="acct.colInvoice">Invoice</th></tr></thead>
      <tbody id="orders"></tbody>
    </table></div>
  </section>
</div>
<script defer src="/assets/site-header.js"></script>
<script src="assets/auth.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const t=(key,fallback)=>{const v=window.I18N?I18N.t(key):key;return v===key?fallback:v;};
  const lang=()=>window.I18N&&I18N.get()==='id'?'id-ID':'en-US';
  const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
  // IDR amounts are rupiah, USD amounts are cents (as the gateways use them).
  const money=(amount,currency)=>currency==='USD'?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(amount/100):rupiah(amount);
  // Indonesian browsers/time zones start in rupiah, everyone else in dollars.
  const defaultCurrency=()=>{
    try{if(/^Asia\/(Jakarta|Pontianak|Makassar|Jayapura)$/.test(Intl.DateTimeFormat().resolvedOptions().timeZone))return 'IDR';}catch(e){}
    return /^id\b/i.test(navigator.language||'')?'IDR':'USD';
  };
  let savedCurrency=null;try{savedCurrency=localStorage.getItem('mf-currency');}catch(e){}
  const date=s=>new Date(s*1000).toLocaleDateString(lang(),{day:'numeric',month:'short',year:'numeric'});
  const orderParam=new URLSearchParams(location.search).get('order');
  let state={user:null,plans:[],providers:{},paymentsEnabled:{},orders:[],cycle:new URLSearchParams(location.search).get('cycle')==='yearly'?'yearly':'monthly',methods:[],
    currency:savedCurrency==='IDR'||savedCurrency==='USD'?savedCurrency:defaultCurrency()};
  const payable=()=>state.paymentsEnabled[state.currency]!==false;
  const priceOf=(plan,cycle)=>state.currency==='USD'?plan.usd[cycle]:plan[cycle];

  function el(tag,props,...children){const node=Object.assign(document.createElement(tag),props||{});node.append(...children);return node;}
  function notice(kind,message,action){
    const box=el('div',{className:'notice '+kind},el('span',{textContent:message}));
    if(action)box.append(action);
    $('notice').replaceChildren(box);
  }
  // Arrived from the link in the verification email.
  if(new URLSearchParams(location.search).get('verified')==='1'){
    history.replaceState(null,'',location.pathname);
    setTimeout(()=>notice('ok',lang()==='id-ID'?'✓ Email terverifikasi. Selamat datang di MyFlipbook!':'✓ Email verified. Welcome to MyFlipbook!'),0);
  }

  function renderProfile(){
    const u=state.user;
    $('profile').hidden=false;
    $('who').textContent=u.name||u.email.split('@')[0];
    $('email').textContent=u.email;
    const id=lang()==='id-ID';
    $('verified').hidden=false;
    $('verified').className='verified'+(u.verified===false?' no':'');
    $('verified').textContent=u.verified===false?(id?'Belum terverifikasi':'Not verified'):(id?'✓ Terverifikasi':'✓ Verified')+(u.google?' · Google':'');
    $('planChip').textContent=u.planName;
    $('planChip').className='chip'+(u.plan!=='basic'?' paid':'');
    $('until').textContent=u.planExpiresAt?t('acct.until','Active until')+' '+date(u.planExpiresAt):'';
  }

  // The plans as on the price list (seo.py plan_cards): monthly shows the month's price, yearly
  // the price per month billed once a year.
  const PLAN_DESC={basic:['Untuk mencoba dan kebutuhan PDF sehari-hari.','For trying out and everyday PDF tasks.'],
    medium:['Untuk guru, dosen, mahasiswa, dan penulis.','For teachers, lecturers, students and writers.'],
    pro:['Untuk penerbit, UMKM, sekolah, dan instansi.','For publishers, small businesses, schools and institutions.']};
  const CHECK='<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const saveOf=plan=>{const m=priceOf(plan,'monthly');return m?Math.round((1-priceOf(plan,'yearly')/(m*12))*100):0;};
  // The highlighted plan: the one picked, else the next step up (Medium from Basic, Pro from Medium).
  const picked=()=>state.pick||(state.user&&state.user.plan!=='basic'?'pro':'medium');
  function renderPlans(){
    const id=lang()==='id-ID',grid=$('plans');grid.replaceChildren();
    const per=t('acct.perMonth','/month');
    const cuts=state.plans.filter(p=>!p.free).map(saveOf).filter(n=>n>0),top=cuts.length?Math.max(...cuts):0;
    $('saveBadge').textContent=top?t('acct.save','save')+' '+(new Set(cuts).size>1?(id?'s.d. ':'up to '):'')+top+'%':'';
    state.plans.forEach(plan=>{
      const current=state.user&&state.user.plan===plan.id,hot=plan.id===picked();
      const card=el('div',{className:'plan'+(hot?' hot':'')+(current?' current':'')});
      card.dataset.plan=plan.id;
      // a click on a plan (its button too) brings the highlight to it
      card.addEventListener('click',()=>{state.pick=plan.id;document.querySelectorAll('.plans3 .plan').forEach(c=>c.classList.toggle('hot',c===card));});
      const badges=el('div',{className:'badges'});
      if(plan.id==='medium')badges.append(el('span',{className:'badge',textContent:id?'Paling populer':'Most popular'}));
      if(current)badges.append(el('span',{className:'badge mine',textContent:t('acct.active','Your plan')}));
      card.append(el('div',{className:'ph'},el('h3',{textContent:plan.name}),badges),
        el('p',{className:'pd',textContent:(PLAN_DESC[plan.id]||['',''])[id?0:1]}));
      const pp=el('div',{className:'pp'}),note=el('p',{className:'pn'});
      if(plan.free){
        pp.append(el('span',{className:'big',textContent:t('acct.free','Free')}));
        note.textContent=id?'Tanpa biaya langganan.':'No subscription fee.';
      }else{
        const m=priceOf(plan,'monthly'),y=priceOf(plan,'yearly');
        const month=state.currency==='USD'?Math.round(y/12):Math.round(y/12/100)*100;   // a year's price per month
        if(state.cycle==='monthly'){
          // launch price: the normal monthly price struck through (rupiah)
          if(state.currency==='IDR'&&plan.listMonthly>m&&m)pp.append(el('s',{className:'was',textContent:money(plan.listMonthly,'IDR')}));
          pp.append(el('span',{className:'big',textContent:money(m,state.currency)}),el('span',{className:'per',textContent:per}));
          note.textContent=id?`atau ${money(month,state.currency)}/bulan jika bayar tahunan`:`or ${money(month,state.currency)}/month billed yearly`;
        }else{
          pp.append(el('span',{className:'big',textContent:money(month,state.currency)}),el('span',{className:'per',textContent:per}));
          note.textContent=id?`ditagih ${money(y,state.currency)}/tahun · hemat ${saveOf(plan)}%`:`billed ${money(y,state.currency)}/year · save ${saveOf(plan)}%`;
        }
      }
      const list=el('ul');
      (plan.features[id?'id':'en']||[]).forEach(f=>{const li=el('li');li.innerHTML=CHECK;li.append(el('span',{textContent:f}));list.append(li);});
      card.append(pp,note,list);
      if(!state.user){
        // Guest: pricing is public; choosing a plan goes through login first.
        card.append(el('a',{className:'pc',href:'login.html?mode=register&next='+encodeURIComponent('account.html'),
          textContent:plan.free?t('acct.startFree','Start free')+' →':t('acct.choose','Choose')+' '+plan.name+' →'}));
      }else if(current){
        // the member's own plan: marked as current; a paid one can still be extended (paid per period)
        card.append(el('button',{className:'pc',type:'button',disabled:true,textContent:id?'Paket Anda saat ini':'Your current plan'}));
        if(!plan.free){
          const renew=el('button',{className:'renew',type:'button',textContent:(id?'Perpanjang masa aktif':'Extend your plan')+' →',disabled:!payable()});
          renew.addEventListener('click',()=>checkout(plan.id,renew));
          card.append(renew);
        }
      }else if(plan.free){
        card.append(el('button',{className:'pc',type:'button',disabled:true,textContent:id?'Selalu gratis':'Always free'}));
      }else{
        const button=el('button',{className:'pc',type:'button',textContent:t('acct.choose','Choose')+' '+plan.name+' →',disabled:!payable()});
        button.addEventListener('click',()=>checkout(plan.id,button));
        card.append(button);
      }
      grid.append(card);
    });
    document.querySelectorAll('[data-cycle]').forEach(b=>b.classList.toggle('on',b.dataset.cycle===state.cycle));
    document.querySelectorAll('[data-currency]').forEach(b=>b.classList.toggle('on',b.dataset.currency===state.currency));
    // Duitku/Tripay channels (QRIS/VA/e-wallet) only apply to rupiah payments.
    $('methodBox').hidden=!(state.currency==='IDR'&&state.methods.length);
  }

  function renderOrders(){
    const body=$('orders');body.replaceChildren();
    if(!state.orders.length){body.append(el('tr',{},el('td',{colSpan:5,className:'clay-muted',textContent:t('acct.noOrders','No payments yet.')})));return;}
    state.orders.forEach(o=>{
      const plan=state.plans.find(p=>p.id===o.plan);
      body.append(el('tr',{},
        el('td',{textContent:date(o.created_at)}),
        el('td',{textContent:(plan?plan.name:o.plan)+' · '+t('acct.'+o.cycle,o.cycle)}),
        el('td',{textContent:money(o.amount,o.currency)}),
        el('td',{textContent:t('status.'+o.status,o.status)}),
        el('td',{},o.status==='paid'?el('span',{className:'invoice-tools'},
          el('a',{className:'invoice-link',href:'/api/billing/orders/'+encodeURIComponent(o.id)+'/invoice.pdf',download:'MyFlipbook-INV-'+o.id+'.pdf',textContent:'⬇ PDF'}),
          printButton(o.id)):'—')));
    });
  }

  // Print an invoice: the PDF in a hidden frame, the browser's print dialog over it
  // (a browser that cannot print a framed PDF gets it in a new tab).
  function printButton(id){
    const b=el('button',{type:'button',className:'invoice-link',textContent:'🖨 '+t('acct.print','Print')});
    b.addEventListener('click',async()=>{
      b.disabled=true;
      try{
        const r=await fetch('/api/billing/orders/'+encodeURIComponent(id)+'/invoice.pdf',{credentials:'same-origin',cache:'no-store'});
        if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||t('acct.invoiceFail','The invoice could not be opened.'));
        const url=URL.createObjectURL(new Blob([await r.arrayBuffer()],{type:'application/pdf'}));
        const frame=el('iframe',{title:'Invoice'});frame.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
        frame.onload=()=>{try{frame.contentWindow.focus();frame.contentWindow.print();}catch(e){window.open(url,'_blank');}};
        frame.src=url;document.body.append(frame);
        setTimeout(()=>{frame.remove();URL.revokeObjectURL(url);},120000);
      }catch(error){notice('err',error.message);}
      finally{b.disabled=false;}
    });
    return b;
  }

  function renderOrderNotice(){
    if(!orderParam){
      if(!payable())notice('warn',t('acct.disabled','Online payment is not enabled on this server yet.'));
      else $('notice').replaceChildren();
      return;
    }
    if(!orderParam)return;
    const order=state.orders.find(o=>o.id===orderParam);
    if(!order)return;
    if(order.status==='paid'){notice('ok',t('acct.paidMsg','Payment received — your plan is active.'));return;}
    if(order.status!=='pending'){notice('err',t('status.'+order.status,order.status));return;}
    if(order.provider==='mock'){
      const pay=el('button',{className:'clay-btn clay-btn-primary',type:'button',textContent:t('acct.mockPay','Simulate payment')});
      pay.addEventListener('click',async()=>{pay.disabled=true;try{await MFAuth.api('POST','/api/billing/mock/pay',{orderId:order.id});await load();}catch(e){notice('err',e.message);}});
      notice('info',t('acct.mock','Local test mode: no payment gateway is configured. Simulate this payment?')+' ('+money(order.amount,order.currency)+')',pay);
    }else{
      notice('info',t('acct.pending','Waiting for payment confirmation…'));
      pollOrder();
    }
  }

  let polls=0;
  function pollOrder(){
    if(polls++>=15)return;
    setTimeout(async()=>{
      const {orders}=await MFAuth.api('GET','/api/billing/orders');
      state.orders=orders;
      const order=orders.find(o=>o.id===orderParam);
      if(order&&order.status!=='pending')await load();else pollOrder();
    },4000);
  }

  async function checkout(plan,button){
    button.disabled=true;
    try{
      const method=state.currency==='IDR'&&state.methods.length?$('method').value:undefined;
      const result=await MFAuth.api('POST','/api/billing/checkout',{plan,cycle:state.cycle,method,currency:state.currency});
      location.href=result.redirectUrl; // Gateway payment page (Duitku/Midtrans/Tripay), or back here (mock) with ?order=
    }catch(error){notice('err',error.message);button.disabled=false;}
  }

  async function load(){
    const me=await MFAuth.me(true);
    if(me.offline){notice('err',t('auth.offline','Accounts need the MyFlipbook server (python server.py).'));return;}
    if(!me.user){
      if(orderParam){location.replace('login.html?next='+encodeURIComponent('account.html'+location.search));return;}
      const plans=await MFAuth.api('GET','/api/billing/plans');
      state=Object.assign(state,{user:null,plans:plans.plans,providers:plans.providers||{},paymentsEnabled:plans.paymentsEnabled||{}});
      $('pageTitle').setAttribute('data-i18n','acct.pricingTitle');
      $('ordersSection').hidden=true;
      const login=el('a',{className:'clay-btn clay-btn-dark',href:'login.html?next='+encodeURIComponent('account.html'),textContent:t('auth.login','Log in')});
      if(state.paymentsEnabled.IDR===false&&state.paymentsEnabled.USD===false)notice('warn',t('acct.disabled','Online payment is not enabled on this server yet.'));
      else notice('info',t('acct.guest','Log in or create an account to subscribe. The free tools need no account.'),login);
      if(window.I18N)I18N.apply();
      renderPlans();
      return;
    }
    $('ordersSection').hidden=false;
    const [plans,orders]=await Promise.all([MFAuth.api('GET','/api/billing/plans'),MFAuth.api('GET','/api/billing/orders')]);
    state=Object.assign(state,{user:me.user,plans:plans.plans,providers:plans.providers||{},paymentsEnabled:plans.paymentsEnabled||{},orders:orders.orders});
    if((state.providers.IDR==='tripay'||state.providers.IDR==='duitku')&&!state.methods.length){
      // Gateway channels (QRIS, VA, e-wallet) grouped as the gateway reports them.
      state.methods=(await MFAuth.api('GET','/api/billing/methods')).methods;
      const select=$('method');select.replaceChildren();
      const groups={};
      state.methods.forEach(m=>{(groups[m.group||'']=groups[m.group||'']||[]).push(m);});
      Object.entries(groups).forEach(([group,items])=>{
        const parent=group?el('optgroup',{label:group}):select;
        items.forEach(m=>parent.append(el('option',{value:m.code,textContent:m.name})));
        if(parent!==select)select.append(parent);
      });

    }
    renderProfile();renderPlans();renderOrders();renderOrderNotice();
    renderReferral();
    renderUsage();
  }
  // Allowance per rolling window (like Claude's limits): what is left and when it refills.
  async function renderUsage(){
    let u;
    try{u=await MFAuth.api('GET','/api/auth/usage');}catch(e){return;}
    if(!u.limited)return;
    const names={office:t('use.office','Conversions & links'),ai:t('use.ai','AI'),translate:t('use.translate','Book translation')};
    const rows=$('usageRows');rows.replaceChildren();
    let any=false;
    Object.entries(u.quotas).forEach(([kind,q])=>{
      if(q.limit===null){rows.append(el('div',{className:'row'},el('b',{textContent:names[kind]}),el('span',{className:'clay-muted',textContent:t('use.unlimited','Unlimited')}),el('span')));return;}
      any=true;
      const left=Math.max(0,q.limit-q.used), pct=Math.min(100,left/q.limit*100);
      const unit=kind==='translate'?t('use.chars','characters'):t('use.times','times');
      const bar=el('div',{className:'bar'},el('span',{className:pct<20?'low':'',style:'width:'+pct+'%'}));
      const when=q.resetAt?t('use.refill','refills at')+' '+new Date(q.resetAt*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):t('use.full','full');
      rows.append(el('div',{className:'row'},el('b',{textContent:names[kind]}),bar,el('span',{className:'clay-muted',textContent:left.toLocaleString()+' / '+q.limit.toLocaleString()+' '+unit+' · '+when})));
    });
    $('usageTitle').textContent=t('use.title','Your allowance (every {h} hours)').replace('{h}',Math.round(u.windowHours));
    $('usage').hidden=false;
  }
  // Invite friends: every 10 friends who subscribe through the link = 1 month free.
  async function renderReferral(){
    let r;
    try{r=await MFAuth.api('GET','/api/auth/referral');}catch(e){return;}
    $('referral').hidden=false;
    $('refLink').value=r.link;
    $('refRule').textContent=t('ref.rule','Share your link. Every {n} friends who sign up through it and subscribe to Medium or Pro give you {d} days of Medium free (or more days of your current paid plan).').replace('{n}',r.target).replace('{d}',r.days);
    const done=r.subscribed%r.target;
    $('refBar').style.width=(done/r.target*100)+'%';
    $('refNext').textContent=t('ref.next','{x} of {n} friends subscribed — {left} more for the next free month.').replace('{x}',done).replace('{n}',r.target).replace('{left}',r.toNext);
    $('refSignups').textContent=r.signups;$('refSubscribed').textContent=r.subscribed;$('refRewards').textContent=r.rewards;
    $('refCopy').onclick=async()=>{
      try{await navigator.clipboard.writeText(r.link);}catch(e){$('refLink').select();document.execCommand('copy');}
      $('refCopy').textContent=t('ref.copied','Copied ✓');setTimeout(()=>{$('refCopy').textContent=t('ref.copy','Copy link');},1500);
    };
  }

  document.querySelectorAll('[data-cycle]').forEach(b=>b.addEventListener('click',()=>{state.cycle=b.dataset.cycle;renderPlans();}));
  document.querySelectorAll('[data-currency]').forEach(b=>b.addEventListener('click',()=>{
    state.currency=b.dataset.currency;try{localStorage.setItem('mf-currency',state.currency);}catch(e){}
    renderPlans();if(state.user&&!orderParam)renderOrderNotice();
  }));
  $('logout').addEventListener('click',async()=>{await MFAuth.api('POST','/api/auth/logout',{});location.href='index.html';});
  document.addEventListener('langchange',()=>{if(state.user){renderProfile();renderPlans();renderOrders();renderOrderNotice();}else if(state.plans.length)load();});
  load().catch(error=>notice('err',error.message));
})();
</script>
</body>
</html>
