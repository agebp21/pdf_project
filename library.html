<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/img/favicon.png?v=pro">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=pro">
<title>My Library — MyFlipbook</title>
<link rel="stylesheet" href="assets/ui-clay.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="assets/i18n.js"></script>
<script src="assets/auth.js" defer></script>
<script src="assets/mf-dialog.js" defer></script>
<style>
  *{box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  body{margin:0;min-height:100dvh;background:#FBFAF7;color:#1C1917}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:-1;
    background:radial-gradient(700px 420px at 50% 0%,#EDF3E4 0%,transparent 60%),radial-gradient(600px 500px at 95% 30%,#F3EFE6 0%,transparent 55%)}
  .wrap{max-width:1100px;margin:0 auto;padding:12px 16px 56px}
  .nav-right{display:flex;align-items:center;gap:8px}
  .lang{border:1px solid #E8E2D4;background:#E9E4FF;border-radius:999px;padding:7px 12px;font-weight:800;font-size:12px;cursor:pointer}
  h1{margin:32px 0 6px;font-size:32px}
  .lead{margin:0 0 18px;color:#57534E;font-size:14px}
  .usage{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 18px}
  .usage b{font-size:14px}
  .meter{flex:1;min-width:200px;height:10px;border-radius:999px;background:#E7E0D2;overflow:hidden}
  .meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#1A3C34,#3f7d62)}
  .meter.full span{background:linear-gradient(90deg,#D31D24,#F0642A)}
  .usage small{color:#78716C}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:18px}
  .book{display:flex;flex-direction:column;padding:12px;gap:10px}
  .cover{aspect-ratio:3/4;border-radius:12px;background:#F3EFE6 center/cover no-repeat;border:1px solid #E9E2D4;display:grid;place-items:center;font-size:40px;color:#C9BFAA}
  .book h3{margin:0;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
  .meta{font-size:11.5px;color:#78716C}
  .files{display:flex;flex-wrap:wrap;gap:6px}
  .file{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;border:1px solid #E4DED0;background:#fff;color:#1A3C34;font-weight:800;font-size:11.5px;text-decoration:none}
  .file:hover{background:#EFF6EC}
  .actions{display:flex;gap:6px;margin-top:auto}
  .actions .clay-btn{flex:1;padding:9px 10px;font-size:12px;text-align:center}
  .delete{border:1px solid #F3D0D0;background:#fff;color:#B91C1C;border-radius:999px;padding:9px 12px;font-weight:800;font-size:12px;cursor:pointer}
  .delete:hover{background:#FEF2F2}
  .empty{padding:36px 20px;text-align:center;color:#57534E}
  .notice{margin:14px 0 0;padding:14px 16px;border-radius:16px;font-size:13px;background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <nav class="clay-nav">
    <a href="index.html" class="clay-brand"><img class="clay-brand-logo" src="assets/img/logo.png?v=pro" alt="MyFlipbook" width="139" height="34"></a>
    <div class="nav-right"><span data-auth-slot></span><a href="flipbook.html" class="clay-btn clay-btn-ghost" style="padding:8px 16px;font-size:12px" data-en="＋ New book">＋ Buku baru</a><button type="button" class="lang" data-lang-toggle>EN</button></div>
  </nav>

  <h1 class="clay-h">📚 My Library</h1>
  <p class="lead" data-en="Every flipbook you make is saved here automatically — encrypted on the server, only you can open it.">Semua flipbook yang kamu buat tersimpan otomatis di sini — terenkripsi di server, hanya kamu yang bisa membukanya.</p>

  <div id="login" class="clay-panel empty" hidden>
    <p data-en="Log in to see your library.">Masuk dulu untuk melihat My Library-mu.</p>
    <a class="clay-btn clay-btn-primary" href="login.html?next=library.html" data-en="Log in">Masuk</a>
  </div>
  <div id="usage" class="clay-panel usage" hidden>
    <b id="usage-books"></b><div class="meter" id="meter"><span></span></div><small id="usage-bytes"></small>
    <a class="clay-btn clay-btn-ghost" href="account.html" style="padding:7px 14px;font-size:12px" id="upgrade" hidden data-en="More space">Tambah ruang</a>
  </div>
  <div id="notice" class="notice" role="alert" hidden></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="clay-panel empty" hidden>
    <p data-en="No books yet. Make your first flipbook — it's saved here automatically.">Belum ada buku. Buat flipbook pertamamu — otomatis tersimpan di sini.</p>
    <a class="clay-btn clay-btn-primary" href="flipbook.html" data-en="＋ Make a flipbook">＋ Buat flipbook</a>
  </div>
</div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const L = (en, id) => window.I18N ? I18N.pick(en, id) : id;
  const el = (tag, props, ...children) => { const n = Object.assign(document.createElement(tag), props || {}); children.forEach(c => c != null && n.append(c)); return n; };
  const size = n => n >= 1073741824 ? (n / 1073741824).toFixed(1) + ' GB' : n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  const when = t => new Date(t * 1000).toLocaleString(L('en-GB', 'id-ID'), {day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'});
  const KIND = {html: '🌐 HTML', apk: '🤖 APK', exe: '🪟 EXE'};
  const covers = [];
  function notice(text) { $('#notice').textContent = text || ''; $('#notice').hidden = !text; }
  async function api(method, path) {
    const response = await fetch(path, {method, credentials: 'same-origin', headers: {Accept: 'application/json'}});
    const data = await response.json().catch(() => ({}));
    if (!response.ok) { const e = Error(data.error || 'HTTP ' + response.status); e.status = response.status; throw e; }
    return data;
  }
  function renderUsage(u) {
    $('#usage').hidden = false;
    $('#usage-books').textContent = (u.maxBooks == null ? u.books : `${u.books} / ${u.maxBooks}`) + L(' books', ' buku');
    const fraction = Math.max(u.maxBooks == null ? 0 : u.books / u.maxBooks, u.bytes / u.maxBytes);
    $('#meter').firstElementChild.style.width = Math.min(100, Math.round(fraction * 100)) + '%';
    $('#meter').classList.toggle('full', fraction >= 0.9);
    $('#usage-bytes').textContent = L(`${size(u.bytes)} of ${size(u.maxBytes)} · ${u.plan} plan`, `${size(u.bytes)} dari ${size(u.maxBytes)} · paket ${u.plan}`);
    $('#upgrade').hidden = u.plan === 'business';
  }
  async function cover(book, box) {
    if (!book.hasCover) return;
    try {
      const response = await fetch(`/api/library/${book.id}/cover`, {credentials: 'same-origin'});
      if (!response.ok) return;
      const url = URL.createObjectURL(await response.blob()); covers.push(url);
      box.style.backgroundImage = `url("${url}")`; box.textContent = '';
    } catch (e) {}
  }
  function card(book) {
    const box = el('div', {className: 'cover', textContent: '📖'});
    cover(book, box);
    const files = el('div', {className: 'files'});
    book.exports.forEach(e => files.append(el('a', {className: 'file', href: `/api/library/${book.id}/exports/${e.id}`, title: `${e.filename} · ${size(e.size)} · ${when(e.createdAt)}`, textContent: KIND[e.kind] || e.kind})));
    files.append(el('a', {className: 'file', href: `/api/library/${book.id}/project`, title: L('Project (.smflipbook) — can be edited again', 'Proyek (.smflipbook) — bisa diedit lagi'), textContent: L('🗂 Project', '🗂 Proyek')}));
    const remove = el('button', {type: 'button', className: 'delete', textContent: '🗑', title: L('Delete from My Library', 'Hapus dari My Library'), ariaLabel: L('Delete ', 'Hapus ') + book.title});
    remove.onclick = async () => {
      if (!await MFDialog.confirm({title: L(`Delete "${book.title}"?`, `Hapus "${book.title}"?`),
        message: L('This book is removed from My Library, with its project and every export. This can\'t be undone.', 'Buku ini dihapus dari My Library, termasuk proyek dan semua hasil ekspornya. Tidak bisa dibatalkan.'),
        ok: L('Delete', 'Hapus'), cancel: L('Cancel', 'Batal'), danger: true})) return;
      remove.disabled = true;
      try { await api('POST', `/api/library/${book.id}/delete`); load(); } catch (e) { notice(e.message); remove.disabled = false; }
    };
    return el('article', {className: 'clay-panel book'},
      box, el('h3', {textContent: book.title}),
      el('div', {className: 'meta', textContent: L(`${book.pageCount || '?'} pages · ${size(book.size)} · changed ${when(book.updatedAt)}`, `${book.pageCount || '?'} halaman · ${size(book.size)} · diubah ${when(book.updatedAt)}`)}),
      files,
      el('div', {className: 'actions'}, el('a', {className: 'clay-btn clay-btn-primary', href: `flipbook.html?library=${book.id}`, textContent: L('✎ Open in the editor', '✎ Buka di editor')}), remove));
  }
  async function load() {
    covers.splice(0).forEach(url => URL.revokeObjectURL(url));
    try {
      const {books, usage} = await api('GET', '/api/library');
      renderUsage(usage);
      $('#grid').replaceChildren(...books.map(card));
      $('#empty').hidden = books.length > 0;
      notice('');
    } catch (e) {
      if (e.status === 401) { $('#login').hidden = false; $('#usage').hidden = true; return; }
      notice(L('My Library could not be loaded: ', 'My Library tidak bisa dimuat: ') + e.message);
    }
  }
  load();
  document.addEventListener('langchange', load);
})();
</script>
</body>
</html>
