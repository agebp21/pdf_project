<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — MyFlipbook</title>
<script src="assets/i18n.js"></script>
<link rel="stylesheet" href="assets/ui-clay.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  body{margin:0;min-height:100dvh;background:#FBFAF7;color:#1C1917}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:-1;
    background:radial-gradient(700px 420px at 50% 0%,#EDF3E4 0%,transparent 60%),radial-gradient(600px 500px at 95% 30%,#F3EFE6 0%,transparent 55%)}
  .wrap{max-width:1100px;margin:0 auto;padding:12px 16px 48px}
  .nav-right{display:flex;align-items:center;gap:8px}
  .lang{border:1px solid #E8E2D4;background:#E9E4FF;border-radius:999px;padding:7px 12px;font-weight:800;font-size:12px;cursor:pointer}
  .card{max-width:420px;margin:48px auto 0;padding:28px 24px}
  .card h1{margin:0;font-size:28px}
  .sub{margin:6px 0 20px;font-size:13px;line-height:1.55}
  label{display:block;font-size:12px;font-weight:800;margin:14px 0 6px}
  .hint{font-size:11px;margin-top:5px}
  .actions{margin-top:20px}
  .actions .clay-btn{width:100%}
  .switch{margin-top:16px;text-align:center;font-size:12.5px}
  .switch button{background:none;border:0;color:#1A3C34;font-weight:800;text-decoration:underline;cursor:pointer;font-size:12.5px}
  .error{display:none;margin-top:14px;background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;border-radius:12px;padding:10px 12px;font-size:12.5px}
  .error.show{display:block}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <nav class="clay-nav">
    <a href="index.html" class="clay-brand"><span class="clay-brand-mark">MF</span> <span class="clay-brand-name">MyFlipbook</span></a>
    <div class="nav-right">
      <button type="button" class="lang" data-lang-toggle>ID</button>
      <a href="index.html" class="clay-btn clay-btn-ghost" style="padding:8px 16px;font-size:12px" data-i18n="auth.back">← All tools</a>
    </div>
  </nav>

  <main class="clay-panel card">
    <h1 class="clay-h" id="title" data-i18n="auth.titleLogin">Welcome back</h1>
    <p class="sub clay-muted" data-i18n="auth.sub">One account for your flipbooks, plan and billing.</p>
    <form id="form" novalidate>
      <div id="nameRow" hidden>
        <label for="name" data-i18n="auth.name">Name (optional)</label>
        <input class="clay-input" id="name" name="name" autocomplete="name" maxlength="80">
      </div>
      <label for="email" data-i18n="auth.email">Email</label>
      <input class="clay-input" id="email" name="email" type="email" autocomplete="email" required>
      <label for="password" data-i18n="auth.password">Password</label>
      <input class="clay-input" id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
      <p class="hint clay-muted" id="pwHint" hidden data-i18n="auth.pwHint">At least 8 characters.</p>
      <div class="actions"><button class="clay-btn clay-btn-primary" id="submit" type="submit" data-i18n="auth.submitLogin">Log in →</button></div>
      <p class="error" id="error" role="alert"></p>
    </form>
    <p class="switch"><button type="button" id="switch" data-i18n="auth.toRegister">New here? Create an account</button></p>
  </main>
</div>
<script src="assets/auth.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const params=new URLSearchParams(location.search);
  const next=MFAuth.safeNext(params.get('next'))||'account.html';
  let mode=params.get('mode')==='register'?'register':'login';
  const t=(key,fallback)=>{const v=window.I18N?I18N.t(key):key;return v===key?fallback:v;};
  function render(){
    const register=mode==='register';
    const set=(id,key)=>{$(id).setAttribute('data-i18n',key);};
    set('title',register?'auth.titleRegister':'auth.titleLogin');
    set('submit',register?'auth.submitRegister':'auth.submitLogin');
    set('switch',register?'auth.toLogin':'auth.toRegister');
    $('nameRow').hidden=!register;$('pwHint').hidden=!register;
    $('password').autocomplete=register?'new-password':'current-password';
    document.title=(register?t('auth.register','Create account'):t('auth.login','Log in'))+' — MyFlipbook';
    if(window.I18N)I18N.apply();
  }
  function showError(message){$('error').textContent=message;$('error').classList.toggle('show',!!message);}
  $('switch').addEventListener('click',()=>{mode=mode==='login'?'register':'login';showError('');render();});
  document.addEventListener('langchange',render);
  $('form').addEventListener('submit',async event=>{
    event.preventDefault();showError('');
    const body={email:$('email').value.trim(),password:$('password').value};
    if(mode==='register')body.name=$('name').value.trim();
    $('submit').disabled=true;
    try{
      await MFAuth.api('POST','/api/auth/'+mode,body);
      location.href=next;
    }catch(error){
      showError(error.status?error.message:t('auth.offline','Accounts need the MyFlipbook server (python server.py).'));
    }finally{$('submit').disabled=false;}
  });
  MFAuth.me().then(data=>{
    if(data.user)location.replace(next);
    else if(data.offline)showError(t('auth.offline','Accounts need the MyFlipbook server (python server.py).'));
  });
  render();
})();
</script>
</body>
</html>
