  .conv-cols{display:grid;gap:1rem;align-items:start;grid-template-columns:minmax(0,1fr)}

  .org-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem;margin-bottom:1rem}

<body class="relative">
  <!-- top bar -->
  <div class="sticky top-3 z-50 max-w-[1440px] mx-auto px-4 pt-3">
    <nav class="clay-nav">
      <a href="index.html" class="clay-brand"><img class="clay-brand-logo" src="assets/img/logo.png?v=pro" alt="MyFlipbook" width="139" height="34"></a>
      <span style="display:flex;align-items:center;gap:8px"><span data-auth-slot></span><a href="index.html" class="clay-btn clay-btn-ghost" style="padding:8px 16px;font-size:12px" data-en="← All tools">← Semua alat</a></span>
    </nav>
  </div>

  <!-- header converter -->
  <header class="relative z-10 max-w-[1440px] mx-auto px-4 pt-8 pb-2 text-center">
    <p class="inline-flex text-[10px] font-extrabold tracking-[.18em] bg-white border border-[#E8E2D4] rounded-full px-3 py-1 shadow-[0_4px_12px_rgba(28,25,23,0.07)]" data-en="✦ CONVERTER • PRIVACY-FIRST • 100% IN BROWSER">✦ KONVERTER • PRIVASI UTAMA • 100% DI BROWSER</p>
    <div class="mt-3 inline-flex items-center gap-3 bg-white border border-[#E8E2D4] rounded-full pl-2 pr-5 py-2 shadow-[0_8px_20px_rgba(28,25,23,0.08)]">
      <div id="toolIcon" class="w-9 h-9 rounded-xl grid place-items-center text-sm font-bold border-[1.5px] border-[#1C1917]"></div>
      <span id="toolTitle" class="font-extrabold text-sm tracking-tight serif text-[17px]"></span>
      <span id="toolBadge" class="text-[10px] bg-[#1A3C34] text-white px-2 py-0.5 rounded-full font-bold"></span>
    </div>
    <p id="toolDesc" class="mt-3 text-[13px] text-gray-500 max-w-2xl mx-auto leading-relaxed"></p>
    <div id="options" class="mt-4 flex flex-wrap justify-center gap-2 text-xs text-left max-w-3xl mx-auto"></div>
  </header>

  <!-- debug log panel (toggle button removed for production; logs stay in console) -->
  <div class="relative z-10 max-w-[1440px] mx-auto px-4">
    <div id="debug" class="hidden mt-2 max-w-3xl mx-auto p-2.5 rounded-xl bg-gray-900 text-white text-[11px] font-mono whitespace-pre-wrap text-left max-h-40 overflow-auto"></div>
  </div>

  <div class="relative z-10 max-w-[1200px] mx-auto px-4 py-6">
    <main class="space-y-4">
      <div id="libStatus" class="hidden p-2.5 rounded-2xl bg-red-50 border border-red-200 text-[11px] text-red-700 leading-relaxed"></div>
      <div class="conv-cols single" id="convGrid">
      <div class="space-y-4 min-w-0" id="colLeft">
      <!-- files + result (left) -->
      <div id="fileList" class="hidden card p-5">
        <div class="flex items-center justify-between mb-3 hide-org">
          <h3 class="font-bold text-[13px] serif text-[16px]"><span data-en="Selected files">File terpilih</span> (<span id="fileCount">0</span>)</h3>
          <div class="flex items-center gap-3">
            <button onclick="addMoreFiles()" class="text-xs font-extrabold text-[#1A3C34] hover:underline" data-en="＋ Add more">＋ Tambah</button>
            <button onclick="clearFiles()" class="text-xs font-extrabold text-red-600 hover:underline" data-en="Remove all">Hapus semua</button>
          </div>
        </div>
        <div id="files" class="space-y-2 hide-org"></div>
        <button id="convertBtn" class="btn-tang mt-4 w-full py-3.5 rounded-2xl text-white font-extrabold text-sm flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
          <span id="btnText">Convert now →</span>
          <span id="btnSpinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        </button>
        <p id="progress" class="hidden text-xs text-center text-gray-500 mt-2"></p>
        <p id="error" class="hidden text-xs text-center text-red-600 mt-2 bg-red-50 border border-red-200 rounded-xl p-2.5 text-left"></p>
      </div>

      <div id="result" class="hidden card p-6">
        <h3 class="font-bold text-[13px] mb-3 serif text-[16px]" data-en="✅ Convert result — nice!">✅ Hasil konversi — beres!</h3>
        <div id="resultPreview" class="rounded-2xl border border-[#E8E2D4] bg-white p-4 text-xs text-gray-600 overflow-auto max-h-[420px]"></div>
        <div id="resultActions" class="flex flex-wrap gap-2 mt-4">
          <a id="downloadBtn" href="#" download class="clay-btn clay-btn-dark" data-en="⬇ Download result">⬇ Unduh hasil</a>
          <button id="makeFlipbook" hidden class="clay-btn" style="background:linear-gradient(180deg,#2A5248,#1A3C34);color:#fff;border-color:#1A3C34">Turn into Flipbook →</button>
          <button onclick="resetAll()" class="clay-btn clay-btn-ghost" data-en="Convert again">Konversi lagi</button>
        </div>
      </div>
      </div><!-- /left -->
      <div class="space-y-4 min-w-0" id="colRight">
      <!-- drop zone (compact, right) -->
      <div id="drop" class="drop card p-4 sm:p-5 text-center cursor-pointer">
        <div class="w-10 h-10 mx-auto rounded-xl bg-[#1A3C34] text-[#FFF7EA] grid place-items-center text-base mb-2 border border-[#E8E2D4] shadow-[0_6px_14px_rgba(26,60,52,.3)]" style="background:linear-gradient(180deg,#2A5248,#1A3C34)">⇧</div>
        <p class="serif font-black text-[16px]" data-en="Drop files, grab a coffee ☕">Taruh file, seruput kopi dulu ☕</p>
        <p class="font-bold text-[12px] mt-0.5" data-en="Drag &amp; drop your files here">Seret &amp; lepas file di sini</p>
        <p id="dropHint" class="text-xs text-[#78716C] mt-1"></p>
        <div class="flex flex-wrap justify-center gap-2 mt-2.5">
          <button id="pickBtn" class="clay-btn clay-btn-dark" data-en="Choose files">Pilih file</button>
          <a href="library.html" class="clay-btn clay-btn-ghost" onclick="event.stopPropagation()" data-en="📚 Open My Library">📚 Buka Perpustakaanku</a>
        </div>
        <input id="fileInput" type="file" class="hidden">
        <p class="text-[11px] text-[#A8A29E] mt-2 font-semibold" data-en="♾️ No size limits — big files are processed right in your browser (depends on RAM)">♾️ Tanpa batas ukuran — file besar diproses langsung di browser (tergantung RAM)</p>
      </div>

      </div><!-- /right -->
      </div><!-- /grid -->
    </main>
  </div>

<script>
const TOOLS = [
  {id:'watermark', title:'Watermark', desc:'Add a text or image watermark to selected pages.', cat:'Edit PDF', icon:'WM', color:'#7e22ce', bg:'#fae8ff', accept:'.pdf', hint:'PDF file - text or PNG/JPEG watermark'},
  {id:'page-numbers', title:'Page numbers', desc:'Number all pages or a selected range.', cat:'Edit PDF', icon:'1 2', color:'#7e22ce', bg:'#fae8ff', accept:'.pdf', hint:'PDF file - choose position and starting number'},
  {id:'crop-pdf', title:'Crop PDF', desc:'Trim visible page margins while preserving PDF content.', cat:'Edit PDF', icon:'Crop', color:'#7e22ce', bg:'#fae8ff', accept:'.pdf', hint:'PDF file - margins in millimeters'},
  {id:'edit-pdf', title:'Edit PDF', desc:'Add text, image stamps, rectangles, ellipses or lines anywhere. Stack annotations, then apply.', cat:'Edit PDF', icon:'✎', color:'#7e22ce', bg:'#fae8ff', accept:'.pdf', hint:'PDF file - stack annotations, then apply'},
  {id:'jpg-to-pdf', title:'Image to PDF', desc:'Any image to PDF in seconds: JPG, PNG, WebP, GIF, BMP, SVG, AVIF, TIFF, HEIC. Set orientation & margins.', cat:'Convert PDF', icon:'IMG', color:'#b45309', bg:'#fef9c3', accept:'.jpg,.jpeg,.png,.webp,.gif,.bmp,.svg,.avif,.ico,.tif,.tiff,.heic,.heif', multiple:true, hint:'All image types — TIFF decoded locally, HEIC converted in-browser, animated/multi-page uses first frame'},
  {id:'pdf-to-jpg', title:'PDF to JPG', desc:'Turn every PDF page into a JPG (or PNG) image.', cat:'Convert PDF', icon:'🖼', color:'#a16207', bg:'#fef9c3', accept:'.pdf', hint:'PDF file — one image per page (ZIP when there are several pages)'},
  {id:'word-to-pdf', title:'Word to PDF', desc:'Convert DOC/DOCX to PDF, keeping the document layout.', cat:'Convert PDF', icon:'W', color:'#1d4ed8', bg:'#dbeafe', accept:'.docx,.doc', hint:'DOCX/DOC file — converted on the MyFlipbook server (log in first)'},
  {id:'pdf-to-word', title:'PDF to Word', desc:'Real .docx that looks like the PDF: text stays editable right on the page (OCR for scans). Or pick a flowing document with real tables.', cat:'Convert PDF', icon:'W', color:'#1d4ed8', bg:'#dbeafe', accept:'.pdf', hint:'PDF file — layout kept, text editable in place (needs internet)'},
  {id:'excel-to-pdf', title:'Excel to PDF', desc:'Convert spreadsheets to PDF using their layout and print settings.', cat:'Convert PDF', icon:'X', color:'#15803d', bg:'#dcfce7', accept:'.xlsx,.xls,.csv', hint:'XLSX/XLS/CSV file — converted on the MyFlipbook server (log in first)'},
  {id:'pdf-to-excel', title:'PDF to Excel', desc:'Data sheet first: columns split into cells, numbers become real numbers. Page images kept on a second sheet.', cat:'Convert PDF', icon:'X', color:'#15803d', bg:'#dcfce7', accept:'.pdf', hint:'PDF file — pages embedded as images, text/OCR on extra sheets (needs internet)'},
  {id:'html-to-pdf', title:'HTML to PDF', desc:'Print a saved web page / HTML file to PDF with its real layout, colours and images.', cat:'Convert PDF', icon:'HTML', color:'#a16207', bg:'#fef9c3', accept:'.html,.htm', hint:'.html / .htm file — printed by Edge/Chrome on the project server'},
  {id:'merge-pdf', title:'Merge PDF', get desc(){return L('Combine PDFs in the order you want.','Gabungkan PDF sesuai urutan yang kamu mau.')}, cat:'Organize PDF', icon:'↘↖', color:'#ea580c', bg:'#fff1e6', accept:'.pdf', multiple:true, get hint(){return L('Choose 2+ PDF files to merge','Pilih 2+ file PDF untuk digabungkan')}},
  {id:'split-pdf', title:'Split PDF', get desc(){return L('Extract pages 1-3, split every N pages, or just click the pages you want.','Extract halaman 1-3, split per N halaman, atau cukup klik halaman yang mau diambil.')}, cat:'Organize PDF', icon:'↗↙', color:'#ea580c', bg:'#fff1e6', accept:'.pdf', get hint(){return L('PDF file — pick a split mode below','File PDF — pilih mode split di bawah')}},
  {id:'compress-pdf', title:'Compress PDF', desc:'Shrink PDFs full of photos and scans: images are resized and re-encoded, text stays sharp.', cat:'Optimize PDF', icon:'⇲', color:'#15803d', bg:'#dcfce7', accept:'.pdf', hint:'PDF file — pick Light / Balanced / Strong'},
  {id:'rotate-pdf', title:'Rotate PDF', get desc(){return L('Rotate PDF pages 90° / 180° / 270° — some pages or all.','Putar halaman PDF 90° / 180° / 270° — per halaman atau semua.')}, cat:'Organize PDF', icon:'↻', color:'#a855a7', bg:'#fae8ff', accept:'.pdf', get hint(){return L('PDF file — pick the angle & pages','File PDF — pilih sudut & halaman')}},
  {id:'organize-pdf', title:'Organize PDF', get desc(){return L('Reorder, delete, rotate or extract pages — drag & drop like a pro tool.','Atur ulang, hapus, putar, atau extract halaman — drag & drop kaya UI pro.')}, cat:'Organize PDF', icon:'A↕B', color:'#ea580c', bg:'#fff1e6', accept:'.pdf', multiple:true, get hint(){return L('PDF files — pages merge into one grid, drag to reorder','File-file PDF — halaman gabung satu grid, drag untuk urutkan')}},
  {id:'ppt-to-pdf', title:'PowerPoint to PDF', desc:'Convert PPTX/PPT slides to PDF with their design kept.', cat:'Convert PDF', icon:'P', color:'#c2410c', bg:'#ffedd5', accept:'.pptx,.ppt', hint:'PPTX/PPT file — converted on the MyFlipbook server (log in first)'},
  {id:'pdf-to-ppt', title:'PDF to PowerPoint', desc:'Real .pptx: slides look like the PDF pages and every text line is an editable text box.', cat:'Convert PDF', icon:'P', color:'#c2410c', bg:'#ffedd5', accept:'.pdf', hint:'PDF file — design kept, text editable on the slide (needs internet)'},
  {id:'pdf-to-md', title:'PDF to Markdown', desc:'Headings, lists, and tables detected — perfect food for AI, notes, and blogs.', cat:'Convert PDF', icon:'{ }', color:'#4C1D95', bg:'#E9E4FF', accept:'.pdf', hint:'PDF file — structure detected from fonts and columns'},
  {id:'ocr-pdf', title:'OCR PDF', desc:'Make scans searchable: the original pages stay exactly as they are, with invisible text you can search, select and copy.', cat:'Convert PDF', icon:'OCR', color:'#15803D', bg:'#DCFCE7', accept:'.pdf', hint:'PDF file — scanned pages are read with OCR (needs internet the first time)'},
  {id:'sign-pdf', title:'Sign PDF', get desc(){return L('Draw, type or upload your signature and place it anywhere on the pages.','Gambar, ketik, atau upload tanda tangan lalu taruh di mana saja di halaman.')}, cat:'Edit PDF', icon:'✍', color:'#1d4ed8', bg:'#dbeafe', accept:'.pdf', get hint(){return L('PDF file — signed in your browser, nothing is uploaded','File PDF — ditandatangani di browser, tidak diunggah')}},
  {id:'pdf-forms', title:'PDF Forms', get desc(){return L('Fill in the fields of a fillable PDF form, then save — optionally locked.','Isi kolom formulir PDF yang bisa diisi, lalu simpan — bisa dikunci.')}, cat:'Edit PDF', icon:'☑', color:'#7e22ce', bg:'#fae8ff', accept:'.pdf', get hint(){return L('PDF with fillable fields (AcroForm)','PDF dengan kolom isian (AcroForm)')}},
  {id:'redact-pdf', title:'Redact PDF', get desc(){return L('Black out names, ID numbers or any area for good — the hidden text is really removed.','Hitamkan nama, NIK, atau area mana pun secara permanen — teks di bawahnya benar-benar dihapus.')}, cat:'Edit PDF', icon:'▇', color:'#111827', bg:'#e7e5e4', accept:'.pdf', get hint(){return L('PDF file — drag boxes or search for text','File PDF — seret kotak atau cari teks')}},
  {id:'scan-to-pdf', title:'Scan to PDF', get desc(){return L('Photograph documents with your phone camera and get a clean, readable PDF.','Foto dokumen dengan kamera HP dan jadikan PDF yang bersih dan mudah dibaca.')}, cat:'Convert PDF', icon:'📷', color:'#b45309', bg:'#fef9c3', accept:'.jpg,.jpeg,.png,.webp', multiple:true, get hint(){return L('Photos (JPG/PNG/WebP) — one per page','Foto (JPG/PNG/WebP) — satu per halaman')}},
  {id:'compare-pdf', title:'Compare PDF', get desc(){return L('Find what changed between two versions of a PDF, line by line.','Temukan perubahan antara dua versi PDF, baris demi baris.')}, cat:'Organize PDF', icon:'⇆', color:'#0f766e', bg:'#ccfbf1', accept:'.pdf', multiple:true, get hint(){return L('Two PDFs — old version first, then the new one','Dua PDF — versi lama dulu, lalu versi baru')}},
];
// English or Indonesian, with the site language (assets/i18n.js).
const L = (en, id) => window.I18N ? I18N.pick(en, id) : en;
// A tool's name in the site language.
const TT = t => (window.I18N && I18N.title ? I18N.title(t.id, t.title) : t.title);
let active = new URLSearchParams(location.search).get('tool') || 'jpg-to-pdf';
// Honest fallback: 18 catalog cards link to tools not built yet. Instead of
// silently opening the wrong tool, remember the request and banner it.
let comingSoonName=null;
if(!TOOLS.find(t=>t.id===active)){
  comingSoonName=active.split('-').map(w=>w==='pdf'?'PDF':(w==='ocr'?'OCR':(w==='ai'?'AI':(w==='md'?'Markdown':w.charAt(0).toUpperCase()+w.slice(1))))).join(' ');
  active='jpg-to-pdf';
}
let files = [];
let splitPageCount = 0;
let splitSelected = new Set();
const $ = s=>document.querySelector(s);
const log = (m)=>{ const d=$('#debug'); d.textContent += m+'\n'; console.log(m); };
const showError = (m)=>{ const e=$('#error'); e.textContent=m; e.classList.remove('hidden'); log('ERROR: '+m); };
function checkLibs(){
  const missing=[];
  if(!window.jspdf) missing.push('jsPDF');
  if(!window.PDFLib) missing.push('pdf-lib');
  if(!window.pdfjsLib) missing.push('pdf.js');
  if(!window.JSZip) missing.push('JSZip');
  if(!window.XLSX) missing.push('SheetJS');
  if(!window.mammoth) missing.push('mammoth');
  const el=$('#libStatus');
  if(missing.length){ el.classList.remove('hidden'); el.innerHTML=L('⚠️ Some components failed to load: <b>','⚠️ Sebagian komponen gagal dimuat: <b>')+missing.join(', ')+L('</b><br>Check your internet connection and reload the page.','</b><br>Periksa koneksi internet lalu muat ulang halaman.'); }
  else { el.classList.add('hidden'); }
  log('Libs: jsPDF=' +(!!window.jspdf)+', PDFLib='+!!window.PDFLib+', pdfjs='+!!window.pdfjsLib+', JSZip='+!!window.JSZip+', XLSX='+!!window.XLSX+', mammoth='+!!window.mammoth);
  log('Protocol: '+location.protocol+' | Tool: '+active);
}
setTimeout(checkLibs, 800);
function renderToolList(){
  // Sidebar was removed for production (tool switching via index catalog).
  // Kept as a no-op guard so setTool/init/langchange keep working.
  const el=$('#toolList');
  if(!el) return;
  el.innerHTML = TOOLS.map(t=>`
    <button onclick="setTool('${t.id}')" class="tool-pill w-full text-left px-3 py-2.5 rounded-xl border flex items-center gap-3 ${active===t.id?'active':'bg-white border-gray-200 hover:bg-gray-50'}">
      <span class="w-9 h-9 rounded-lg grid place-items-center text-[11px] font-bold shrink-0" style="background:${t.bg};color:${t.color};border:1px solid ${t.color}18">${t.icon}</span>
      <span class="min-w-0">
        <span class="block text-xs font-bold leading-none truncate">${TT(t)}</span>
        <span class="block text-[11px] leading-none mt-1 truncate ${active===t.id?'text-white/70':'text-gray-500'}">${t.cat}</span>
      </span>
    </button>
  `).join('');
}
function renderHeader(){
  const t = TOOLS.find(x=>x.id===active);
  $('#toolIcon').style.background=t.bg; $('#toolIcon').style.color=t.color; $('#toolIcon').textContent=t.icon;
  $('#toolIcon').style.border='1px solid '+t.color+'18';
  $('#toolTitle').textContent=TT(t);
  $('#toolDesc').textContent=(window.I18N ? I18N.tool(t.id, t.desc) : t.desc);
  { const CAT_ID={'Workflows':'Alur kerja','Organize PDF':'Atur PDF','Optimize PDF':'Optimalkan PDF','Convert PDF':'Konversi PDF','Edit PDF':'Edit PDF','PDF Security':'Keamanan PDF','PDF Intelligence':'Kecerdasan PDF'};
    $('#toolBadge').textContent=L(t.cat, CAT_ID[t.cat]||t.cat); }
  // Upload hint in the site language.
  const HINT_ID={'watermark':'File PDF - watermark teks atau PNG/JPEG','page-numbers':'File PDF - pilih posisi dan nomor awal','crop-pdf':'File PDF - margin dalam milimeter',
    'edit-pdf':'File PDF - tumpuk anotasi, lalu terapkan','jpg-to-pdf':'Semua jenis gambar — TIFF dibaca di perangkat, HEIC diubah di browser, gambar animasi/banyak halaman memakai bingkai pertama',
    'pdf-to-jpg':'File PDF — satu gambar per halaman (ZIP bila halamannya banyak)','word-to-pdf':'File DOCX/DOC — dikonversi di server MyFlipbook (login dulu)',
    'pdf-to-word':'File PDF — tata letak tetap, teks bisa diedit di tempat (perlu internet)','excel-to-pdf':'File XLSX/XLS/CSV — dikonversi di server MyFlipbook (login dulu)',
    'pdf-to-excel':'File PDF — halaman jadi gambar, teks/OCR di sheet tambahan (perlu internet)','html-to-pdf':'File .html / .htm — dicetak Edge/Chrome di server proyek',
    'merge-pdf':'Pilih 2+ file PDF untuk digabungkan','split-pdf':'File PDF — pilih mode pisah di bawah','compress-pdf':'File PDF — pilih Ringan / Seimbang / Kuat',
    'rotate-pdf':'File PDF — pilih sudut & halaman','organize-pdf':'File PDF — halaman digabung dalam satu grid, seret untuk mengurutkan',
    'ppt-to-pdf':'File PPTX/PPT — dikonversi di server MyFlipbook (login dulu)','pdf-to-ppt':'File PDF — desain tetap, teks bisa diedit di slide (perlu internet)',
    'pdf-to-md':'File PDF — struktur dikenali dari font dan kolom','ocr-pdf':'File PDF — halaman scan dibaca dengan OCR (perlu internet pertama kali)',
    'sign-pdf':'File PDF — ditandatangani di browser, tidak ada yang diunggah','pdf-forms':'PDF dengan kolom isian (AcroForm)','redact-pdf':'File PDF — seret kotak atau cari teks',
    'scan-to-pdf':'Foto (JPG/PNG/WebP) — satu per halaman','compare-pdf':'Dua PDF — versi lama dulu, lalu yang baru'};
  $('#dropHint').textContent=L(t.hint, HINT_ID[t.id]||t.hint);
  $('#fileInput').accept=t.accept;
  $('#fileInput').multiple=!!t.multiple;
  let html='';
  if(t.id==='jpg-to-pdf'){
    html=`<label class="flex items-center gap-2 bg-white border border-gray-200 rounded-full px-3 py-1.5 shadow-sm">${L('Orientation:','Orientasi:')}
      <select id="opt-orient" class="bg-white border-0 text-xs font-medium focus:ring-0"><option value="auto">${L('Auto (follow each image)','Otomatis (ikuti tiap gambar)')}</option><option value="p">${L('Portrait','Tegak')}</option><option value="l">${L('Landscape','Mendatar')}</option></select></label>
      <label class="flex items-center gap-2 bg-white border border-gray-200 rounded-full px-3 py-1.5 shadow-sm">${L('Size:','Ukuran:')}
      <select id="opt-size" class="bg-white border-0 text-xs font-medium focus:ring-0"><option value="fit" selected>${L('Same as image (no margin)','Sama dengan gambar (tanpa margin)')}</option><option value="a4">A4</option><option value="letter">Letter</option></select></label>
      <label class="flex items-center gap-2 bg-white border border-gray-200 rounded-full px-3 py-1.5 shadow-sm">${L('Margin:','Margin:')}
      <select id="opt-margin" class="bg-white border-0 text-xs font-medium focus:ring-0"><option value="10">Normal</option><option value="0">${L('None','Tanpa')}</option><option value="20">${L('Wide','Lebar')}</option></select></label>`;
  }else if(t.id==='html-to-pdf'){
    html=`<label class="flex items-center gap-2 bg-white border border-gray-200 rounded-full px-3 py-1.5 shadow-sm">${L('Paper:','Kertas:')}
      <select id="opt-paper" class="bg-white border-0 text-xs font-medium focus:ring-0"><option value="a4">A4</option><option value="letter">Letter</option><option value="a3">A3</option><option value="legal">Legal</option></select></label>
      <label class="flex items-center gap-2 bg-white border border-gray-200 rounded-full px-3 py-1.5 shadow-sm">${L('Margin:','Margin:')}
      <select id="opt-html-margin" class="bg-white border-0 text-xs font-medium focus:ring-0"><option value="12">Normal</option><option value="0">${L('None','Tanpa')}</option><option value="20">${L('Wide','Lebar')}</option></select></label>
      <span class="text-[11px] text-gray-500 w-full text-center">${L("Images inside the page must be embedded or online. A page's own print settings (@page) win over these.",'Gambar di halaman harus tertanam atau online. Pengaturan cetak halaman itu sendiri (@page) lebih diutamakan.')}</span>`;
  }else if(t.id==='pdf-to-jpg'){
    html=`<label class="flex items-center gap-2 bg-white border border-gray-200 rounded-full px-3 py-1.5 shadow-sm">${L('Quality:','Kualitas:')}
      <select id="opt-quality" class="bg-white border-0 text-xs font-medium focus:ring-0"><option value="1.5">${L('Standard','Standar')}</option><option value="2" selected>${L('High (2x)','Tinggi (2x)')}</option><option value="3">Ultra (3x)</option></select></label>

let organizeOrder = []; // page indices (numbers) or 'blank-N' ids, in current order
// Workspace mode: merge keeps today's behavior (click flips); split and
// edit select pages (red) for their actions; compress needs no selection.
let orgMode = 'merge';
// Edit-toolbar state (zoom level + hand/pan). Declared up here so
// paintOrgMode can read them even on the very first render.
let orgZoom = 1, orgHand = false;
window.orgModeSet = (mode) => {
  if (!['merge', 'split', 'edit', 'compress'].includes(mode)) return;
  orgMode = mode;
  paintOrgMode();
  renderOrganizeGrid();
  log('Org mode ' + mode);
};
function paintOrgMode() {
  document.querySelectorAll('.org-tabs button').forEach(b => b.classList.toggle('active', b.dataset.mode === orgMode));
  // The Merge/Split/Edit/Compress menu above the preview stays visible even
  // before a file is picked; only the mode toolboxes wait for pages.
  const loaded = files.length > 0;
  const editTools = document.getElementById('orgEditTools');
  if (editTools) editTools.classList.toggle('is-hidden', !loaded || orgMode !== 'edit');
  const hand = document.getElementById('orgHandBtn');
  if (hand) hand.classList.toggle('active', orgHand);
  const zoom = document.getElementById('orgZoomLabel');
  if (zoom) zoom.textContent = Math.round(orgZoom * 100) + '%';
  const split = document.getElementById('orgSplitTools');
  if (split) split.classList.toggle('is-hidden', !loaded || orgMode !== 'split');
  const compress = document.getElementById('orgCompressTools');
  if (compress) compress.classList.toggle('is-hidden', !loaded || orgMode !== 'compress');
}
// ---------- Edit toolbar above the preview: zoom, hand, text, shapes.
// Zoom rebuilds the mini-reader at a new size; hand swaps page-flip input
// for drag-to-pan; text/shapes reuse the annotate pipeline (PDFEdit) on the
// selected pages, so the result downloads like the sidebar Add button.
function orgReaderZoomRebuild() {
  orgReaderClose(); orgBook = null; orgStatic = false;
  orgReaderBuild();
}
window.orgZoomStep = step => {
  orgZoom = Math.min(2, Math.max(0.5, Math.round((orgZoom + step) * 100) / 100));
  paintOrgMode();
  if (!organizeOrder.length) return;
  orgReaderZoomRebuild();
};
window.orgHandToggle = () => {
  orgHand = !orgHand;
  paintOrgMode();
  if (!organizeOrder.length) return;
  orgReaderZoomRebuild();
};
window.orgEditTextToggle = () => {
  const row = document.getElementById('orgEditTextRow');
  if (!row) return;
  row.classList.toggle('is-hidden');
  const input = document.getElementById('orgEditText');
  if (input && !row.classList.contains('is-hidden')) input.focus();
};
window.orgEditTextApply = async () => {
  try {
    if (files.length === 0) throw new Error('Upload a PDF first');
    const positions = orgSelectedPositions();
    if (!positions.length) throw new Error('Tick pages first');
    const text = String((document.getElementById('orgEditText') || {}).value ?? '').trim();
    if (!text) throw new Error('Enter annotation text.');
    const sizeRaw = Number((document.getElementById('orgEditSize') || {}).value);
    await orgApplyAnnotate([{ kind: 'text', text, size: (Number.isFinite(sizeRaw) && sizeRaw > 0) ? sizeRaw : 14,
      range: 'all', position: 'center', margin: '10', dx: '0', dy: '0',
      rotation: '0', color: '#214d40', opacity: '100' }], positions);

function orgOcrLines(data, canvas) {
  const out = [];
  for (const line of (data.lines || [])) {
    const words = (line.words || []).filter(w => /[\p{L}\p{N}]/u.test(w.text || '') && (w.confidence || 0) >= 50);
    if (!words.length) continue;
    const said = words.map(w => String(w.text).trim()).join(' ').replace(/\s+/g, ' ');
    if ((said.match(/[\p{L}\p{N}]/gu) || []).length < 2) continue;
    out.push({
      text: said,
      x0: Math.min(...words.map(w => w.bbox.x0)) / canvas.width,
      y0: Math.min(...words.map(w => w.bbox.y0)) / canvas.height,
      x1: Math.max(...words.map(w => w.bbox.x1)) / canvas.width,

// Tesseract often reports the same printed line two or three times (stacked
// boxes, e.g. a title plus its own words again). Merge vertical duplicates
// into one clean selectable line; genuinely separate lines never overlap
// each other this much, so they survive untouched.
function orgMergeOcrLines(lines) {
  const sorted = lines.slice().sort((a, b) => a.y0 - b.y0 || a.x0 - b.x0);
  const groups = [];
  for (const line of sorted) {
    let best = null, bestScore = 0;
    for (const g of groups) {
      const overlap = Math.max(0, Math.min(g.y1, line.y1) - Math.max(g.y0, line.y0));
      const score = overlap / Math.max(1e-6, Math.min(g.y1 - g.y0, line.y1 - line.y0));
      if (score > bestScore) { bestScore = score; best = g; }
    }
    if (best && bestScore > 0.5) {
      best.x0 = Math.min(best.x0, line.x0); best.y0 = Math.min(best.y0, line.y0);
      best.x1 = Math.max(best.x1, line.x1); best.y1 = Math.max(best.y1, line.y1);
      best.parts.push(line);
    } else groups.push({ x0: line.x0, y0: line.y0, x1: line.x1, y1: line.y1, parts: [line] });
  }
  return groups.map(g => {
    g.parts.sort((a, b) => a.x0 - b.x0);
    // Same words detected twice: keep each word once, in reading order.
    const words = [];
    for (const p of g.parts) for (const wd of String(p.text).split(/\s+/)) {
      if (wd && !words.some(o => o.toLowerCase() === wd.toLowerCase())) words.push(wd);
    }
    return { text: words.join(' '), x0: g.x0, y0: g.y0, x1: g.x1, y1: g.y1 };
  }).filter(l => l.text);
}

async function orgBurnEdits(out, page, code) {

    const yTop = H - e.y0 * H, h = (e.y1 - e.y0) * H;
    if (w < 2 || h < 2) continue;

    let size = h * 0.8;
    try {
      const natural = font.widthOfTextAtSize(text, size);
      if (natural > w) size = size * w / natural;
    } catch (_) {}
    if (!(size >= 3)) size = 3;

  try{ orgBook.update(); cur=orgBook.getCurrentPageIndex(); }catch(e){ return; }

let _utifLoading=null;
function ensureUTIF(){

      const s=document.createElement('script');

}

// Load any supported image into canvases (one per page: multi-page TIFFs
// give every page). Native formats via <img>, HEIC via heic2any, TIFF via
// UTIF. Transparency → white. photo=true: stored as JPEG, else lossless.
async function loadDrawables(file){
  const lower=file.name.toLowerCase();
  const photo=/\.(jpe?g|webp|heic|heif|avif|tiff?)$/.test(lower);
  if(lower.endsWith('.tif')||lower.endsWith('.tiff')){
    await ensureUTIF();
    const buf=await file.arrayBuffer();
    const ifds=window.UTIF.decode(buf).filter(ifd=>ifd.t256&&ifd.t257);
    if(!ifds.length) throw new Error('Could not read TIFF '+file.name);
    return ifds.map(ifd=>{
      window.UTIF.decodeImage(buf, ifd);
      const rgba=window.UTIF.toRGBA8(ifd);
      const canvas=document.createElement('canvas');
      canvas.width=ifd.width; canvas.height=ifd.height;
      const ctx=canvas.getContext('2d');
      const layer=document.createElement('canvas'); layer.width=ifd.width; layer.height=ifd.height;
      layer.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(rgba.buffer), ifd.width, ifd.height), 0, 0);
      ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(layer,0,0);
      return {canvas, photo};
    });
  }
  return [{canvas:await loadDrawable(file), photo}];
}
async function loadDrawable(file){
  const lower=file.name.toLowerCase();
  const loadImg=(blob)=>new Promise((res,rej)=>{
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Failed to load image '+file.name)); };
    img.src=url;
  });
  let img;
  if(lower.endsWith('.heic')||lower.endsWith('.heif')){
    await ensureHeic();
    const jpeg=await window.heic2any({blob:file, toType:'image/jpeg', quality:0.92});
    img=await loadImg(Array.isArray(jpeg)?jpeg[0]:jpeg);
  }else{
    img=await loadImg(file);
  }
  if(!img.naturalWidth||!img.naturalHeight) throw new Error('Image has no readable size (SVGs need width/height): '+file.name);
  const canvas=document.createElement('canvas');
  canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0);
  return canvas;
}
async function convertJpgToPdf(){
  if(!window.jspdf) throw new Error('jsPDF not loaded — check internet');
  const {jsPDF}=window.jspdf;
  const orientChoice=$('#opt-orient')?.value||'auto';
  const size=$('#opt-size')?.value||'a4';
  const margin=size==='fit'?0:Number($('#opt-margin')?.value??10);
  log(`ImageToPDF orient=${orientChoice} size=${size} margin=${margin} files=${files.length}`);
  let pdf=null, pages=0;
  for(let i=0;i<files.length;i++){
    $('#progress').textContent=L(`Processing image ${i+1}/${files.length}...`,`Memproses gambar ${i+1}/${files.length}...`);
    const drawables=await loadDrawables(files[i]);
    for(const {canvas, photo} of drawables){
      const iw=canvas.width, ih=canvas.height;
      log(`Image ${i+1}: ${iw}x${ih} ${photo?'JPEG':'lossless'}`);
      // Page: the image's own size (at 96 dpi) for "same as image", else A4/Letter.
      let orientation=orientChoice==='auto' ? (iw>ih?'l':'p') : orientChoice;
      const format=size==='fit' ? [iw*0.264583, ih*0.264583] : size;
      if(size==='fit') orientation=iw>ih?'l':'p';
      if(!pdf) pdf=new jsPDF({orientation, unit:'mm', format});
      else pdf.addPage(format, orientation);
      const w=pdf.internal.pageSize.getWidth(), h=pdf.internal.pageSize.getHeight();
      // Fit inside the margins, keep the aspect ratio, centre on the page.
      const scale=Math.min((w-margin*2)/iw, (h-margin*2)/ih);
      const dw=iw*scale, dh=ih*scale;
      const data=photo ? canvas.toDataURL('image/jpeg',0.92) : canvas.toDataURL('image/png');
      pdf.addImage(data, photo?'JPEG':'PNG', (w-dw)/2, (h-dh)/2, dw, dh, undefined, photo?'NONE':'FAST');

  downloadBlob(blob, (files.length>1?base+'-and-'+(files.length-1)+'-more':base)+'.pdf');

async function convertPdfToJpg(){

  const base=file.name.replace(/\.pdf$/i,'');

    const page=await pdf.getPage(i);
    let vp=page.getViewport({scale});

    const fit=Math.min(1, MAX_SIDE/Math.max(vp.width,vp.height), Math.sqrt(MAX_PIXELS/(vp.width*vp.height)));

    const ctx=canvas.getContext('2d');

    canvas.width=canvas.height=0;

  const note=document.createElement('p'); note.className='text-center text-gray-500 mb-2 text-xs';

function parseRange(str, max){
  const out=new Set();
  str.split(',').forEach(part=>{
    part=part.trim();
    if(!part) return;
    if(part.includes('-')){
      const [a,b]=part.split('-').map(n=>parseInt(n.trim()));
      if(isNaN(a)||isNaN(b)) throw new Error(L(`Wrong range: ${part}`,`Rentang salah: ${part}`));
      const s=Math.min(a,b), e=Math.max(a,b);
      for(let i=s;i<=e;i++) if(i>=1&&i<=max) out.add(i-1);
    }else{
      const n=parseInt(part);
      if(isNaN(n)) throw new Error(L(`Wrong page: ${part}`,`Halaman salah: ${part}`));
      if(n>=1&&n<=max) out.add(n-1);
    }
  });
  return [...out].sort((a,b)=>a-b);
}

async function compressPdf(){
  if(!window.PDFLib||!window.PDFCompress) throw new Error('PDF engine not loaded — reload the page');
  const level=document.querySelector('input[name="compressLevel"]:checked')?.value||'medium';
  const source=files[0], buf=await source.arrayBuffer();
  log('Compress level='+level+' size='+buf.byteLength);
  const {bytes, stats}=await PDFCompress.compress(buf, level, {onProgress:(message)=>{ $('#progress').textContent=message; }});
  const saved=stats.before?((1-stats.after/stats.before)*100):0;
  log(`Compress ${stats.before} -> ${stats.after} (${saved.toFixed(1)}%) images=${stats.images} recoded=${stats.recoded} skipped=${stats.skipped}`);
  downloadBlob(new Blob([bytes],{type:'application/pdf'}), source.name.replace(/\.pdf$/i,'')+`-compressed-${level}.pdf`);
  const summary=document.createElement('p'); summary.className='text-center py-2 text-xs';
  const kb=n=>n>1048576?(n/1048576).toFixed(2)+' MB':(n/1024).toFixed(1)+' KB';
  summary.append(`📦 ${kb(stats.before)} → ${kb(stats.after)}`, document.createElement('br'));
  const headline=document.createElement('b');
  headline.textContent=stats.unchanged||saved<1 ? 'Already compact — nothing to gain' : `${saved.toFixed(0)}% smaller (${PDFCompress.LEVELS[level].label})`;
  summary.append(headline, document.createElement('br'));
  const note=document.createElement('span'); note.className='text-gray-500';
  note.textContent=!stats.images ? 'This PDF has no photos or scans; text and drawings are already stored efficiently.'
    : `${stats.recoded} of ${stats.images} image${stats.images===1?'':'s'} re-encoded`+(stats.skipped?` · ${stats.skipped} kept as-is (already small or special format)`:'')+'.';
  summary.append(note);
  $('#resultPreview').prepend(summary);
}

async function buildOrganizePdf(order){
  if(!window.PDFLib) throw new Error('pdf-lib not loaded');
  if(!order || order.length===0) throw new Error(L('Tick pages first','Centang halaman dulu'));
  log('Organize order '+order.map(orgName).join(',')+' rotations '+JSON.stringify(organizeRotations));
  const out=await PDFLib.PDFDocument.create();
  // Pages may come from several documents: copy per file, then interleave.
  const needFiles=[...new Set(order.filter(i=>typeof i==='number').map(i=>Math.floor(i/1000000)))].sort((a,b)=>a-b);
  const srcs=new Map(), copied=new Map();
  for(const fi of needFiles){
    const buf=await files[fi].arrayBuffer();
    const src=await PDFLib.PDFDocument.load(buf,{ignoreEncryption:true});
    srcs.set(fi,src);
    const pages=order.filter(i=>typeof i==='number'&&Math.floor(i/1000000)===fi).map(i=>i%1000000);
    copied.set(fi,await out.copyPages(src,pages));
  }
  let firstSize=null;
  if(srcs.has(0)) firstSize=srcs.get(0).getPage(0).getSize();
  else if(files.length){ const s0=await PDFLib.PDFDocument.load(await files[0].arrayBuffer(),{ignoreEncryption:true}); firstSize=s0.getPage(0).getSize(); }
  const used=new Map();
  orgEditFont = null; // embedded fresh into each output document
  for(const idx of order){
    if(typeof idx==='number'){
      const f=Math.floor(idx/1000000), n=used.get(f)||0; used.set(f,n+1);
      const p=copied.get(f)[n];
      if(orgTextEdits[idx]&&orgTextEdits[idx].length) await orgBurnEdits(out,p,idx);
      const rot=organizeRotations[idx]||0;
      if(rot) p.setRotation(PDFLib.degrees(rot%360));
      out.addPage(p);
    }else if(firstSize){
      const rot=organizeRotations[idx]||0;
      const p=out.addPage([firstSize.width,firstSize.height]);
      const imgUrl=orgBlankImg[idx];
      if(imgUrl){
        try{
          const jpg=await out.embedJpg(orgBlankBytes(imgUrl));
          const dw=firstSize.width, dh=firstSize.height;
          const sc=Math.min(dw/jpg.width, dh/jpg.height);
          const iw=jpg.width*sc, ih=jpg.height*sc;
          p.drawImage(jpg,{x:(dw-iw)/2, y:(dh-ih)/2, width:iw, height:ih});
        }catch(e){ log('Org blank image fail '+idx); }
      }
      if(rot) p.setRotation(PDFLib.degrees(rot%360));
    }
  }
  return out.save();
}

// Free annotation on the selected pages (grid order): text, rectangle,
// ellipse (W×H like 40x20, or one number for square/circle), line (length,
// thickness from the size box) or a picked image. Centred, theme color,
// fully opaque — the standalone Edit PDF tool covers the fancy options.
function orgAnnElement(kind) {
  const text = String(($('#orgAnnText') || {}).value ?? '').trim();
  const sizeRaw = Number(($('#orgAnnSize') || {}).value);
  const base = { kind, range: 'all', position: 'center', margin: '10', dx: '0', dy: '0',
    rotation: '0', color: '#214d40', opacity: '100' };
  if (kind === 'text') {
    if (!text) throw Error(L('Enter annotation text.', 'Isi teks anotasi.'));
    base.text = text;
    base.size = (Number.isFinite(sizeRaw) && sizeRaw > 0) ? sizeRaw : 14;
  } else if (kind === 'rect' || kind === 'ellipse') {
    const match = text.match(/^\s*(\d+(?:\.\d+)?)\s*(?:x\s*(\d+(?:\.\d+)?))?\s*$/i);
    if (!match) throw Error(L('Size like 40x20 (or one number for square).', 'Ukuran seperti 40x20 (atau satu angka untuk persegi).'));
    base.width = Number(match[1]); base.height = Number(match[2] || match[1]);
    base.border = 0;
  } else if (kind === 'line') {
    const len = Number(text);
    if (!Number.isFinite(len) || len <= 0) throw Error(L('Line length must be a number above 0.', 'Panjang garis harus angka di atas 0.'));
    base.length = len;
    base.thickness = (Number.isFinite(sizeRaw) && sizeRaw > 0) ? sizeRaw : 1;
  } else if (kind === 'image') {
    return null; // picked through the file dialog below
  } else throw Error(L('Pick an annotation kind first.', 'Pilih jenis anotasi dhisik.'));
  return base;
}

// Layout pages shared by Word ("keep look") and PowerPoint: text-free page
// background + positioned editable text runs. Pages without paintable text
// (scans) keep the full page image and get OCR lines instead.
async function pdfLayoutPages(pdf, progress, options={}){
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    progress(`Rebuilding page ${i}/${pdf.numPages}...`);
    const page=await pdf.getPage(i);
    const layout=await PdfLayout.layoutPage(page, {maxPx:1800, images:!!options.images});
    layout.ocr=[];
    if(!layout.runs.length){
      try{
        progress(`Page ${i} has no text — loading OCR...`);
        await ensureTesseract();
        layout.ocr=await ocrPageToLines(page, i);
      }catch(cause){ log(`Page ${i}: OCR failed — ${cause.message}`); }
    }
    log(`Page ${i}: ${layout.runs.length} text boxes, ${layout.ocr.length} OCR lines`);
    page.cleanup();
    pages.push(layout);
  }
  return pages;
}
// Flowing-mode helpers: headings from relative font size, soft-wrapped lines
// joined back into paragraphs (next line starts lowercase / prev ends with , or -).
function flowParagraphs(pages){
  const sizes=[];
  pages.forEach(pg=>pg.lines.forEach(l=>{ if(l.size) sizes.push(l.size); }));
  sizes.sort((a,b)=>a-b);
  const body=sizes.length?sizes[Math.floor(sizes.length/2)]:0;
  return pages.map(pg=>{
    const out=[];
    pg.lines.forEach(l=>{
      // Consecutive multi-column lines (split at wide gutters) become a table.
      if((l.cells||[]).length>1){
        const prev=out[out.length-1];
        if(prev&&prev.table) prev.table.push(l.cells); else out.push({table:[l.cells], source:l.source});
        return;
      }
      const level=!body||!l.size?0:(l.size>=body*1.6?1:(l.size>=body*1.25?2:(l.bold&&l.text.length<90&&l.size>=body?3:0)));
      const prev=out[out.length-1];
      const continues=prev&&!prev.level&&!level&&prev.source===l.source&&(/^[a-z(]/.test(l.text)||/[,\-–]$/.test(prev.text))&&Math.abs((prev.size||0)-(l.size||0))<0.6;
      if(continues) prev.text=prev.text.replace(/-$/,'')+(/-$/.test(prev.text)?'':' ')+l.text;
      else out.push({text:l.text, level, bold:!!l.bold, size:l.size, source:l.source});
    });
    return out;
  });
}

      children.push(new Paragraph({children:[new TextRun({text:'Text read with OCR (please proofread):', bold:true, color:'808080'})]}));

  };

      if(!pg.runs.length){ sections.push(scanSection(pg.background, pg.ocr, pg.width, pg.height)); return; }
      const children=[new Paragraph({children:[new ImageRun({type:'jpg', data:b64ToU8(pg.background.b64),
        transformation:{width:Math.round(pg.width*96/72), height:Math.round(pg.height*96/72)},
        floating:{horizontalPosition:{relative:D.HorizontalPositionRelativeFrom.PAGE, offset:0}, verticalPosition:{relative:D.VerticalPositionRelativeFrom.PAGE, offset:0}, behindDocument:true, allowOverlap:true, lockAnchor:true}})]})];
      pg.runs.forEach(r=>{

      textRows.push(multi?[i, l.line, l.source, cells.join(' | ')]:[i, l.line, l.source, l.text]);
    });
  });
  if(tableRows.length){
    wt.addTable({
      name:'PdfExtract',
      ref:'A1',
      headerRow:true,
      totalsRow:false,
      style:{theme:'TableStyleMedium9', showRowStripes:true},
      columns:multi?[{name:'Page', filterButton:true},{name:'Line', filterButton:true},{name:'Source', filterButton:true},...Array.from({length:maxCols},(_,k)=>({name:'Col '+(k+1), filterButton:true}))]:[{name:'Page', filterButton:true},{name:'Line', filterButton:true},{name:'Source', filterButton:true},{name:'Text', filterButton:true}],
      rows:tableRows,
    });
    // Show parsed numbers the way the PDF wrote them (%, thousands, Rp).
    rawRows.forEach((cells,r)=>cells.forEach((raw,c)=>{
      const format=excelFormat(raw);
      if(format) wt.getCell(r+2, c+4).numFmt=format;
    }));
  }else{
    wt.addRow(['Page','Line','Source','Text']).font={bold:true};
  }
  // Sheet 3 (only when needed): honest notes about thin/OCR/empty pages.
  const avg=totalChars/pdf.numPages;
  if(avg<120 || emptyPages>0 || ocrPages>0){
    const wn=wb.addWorksheet('README');
    wn.columns=[{width:130}];
    wn.addRow(['Note: how this Excel was made']).font={bold:true};
    wn.addRow([`Pages: ${pdf.numPages}. Text pages: ${pdf.numPages-emptyPages-ocrPages}. OCR pages: ${ocrPages}. Empty pages: ${emptyPages}. Average ${Math.round(avg)} text chars per page.`]);
    wn.addRow([`Sheet 'Pages (Images)' holds every page as an image plus editable text cells beside each picture — editing those cells never changes the picture.`]);
    wn.addRow([`Sheet 'Data' is a real Excel table; numbers like 1.250.000 / 1,250.50 / Rp 5.000 / 12% become real numbers so formulas work. Wide-gutter lines are split into Col 1..N; rows marked 'OCR' were read from page images (English + Indonesian). Proofread numbers carefully.`]);
    wn.addRow([`Pages that are pure artwork are left without text on purpose — guessing would print fake rows.`]);
  }
  const out=await wb.xlsx.writeBuffer();
  downloadBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), files[0].name.replace(/\.pdf$/i,'')+'.xlsx', {flipbookSource:files[0]});
}

async function ocrSearchablePdf(){
  if(!window.pdfjsLib || !window.PDFLib || !window.PDFOcrLayer) throw new Error('Libraries not loaded yet — reload the page');
  const lang=$('#opt-ocr-lang')?.value||'eng+ind';
  const source=files[0], buf=await source.arrayBuffer();
  let doc, pdf;
  try{ doc=await PDFLib.PDFDocument.load(buf); pdf=await pdfjsLib.getDocument({data:buf.slice(0), disableWorker: location.protocol==='file:'}).promise; }
  catch(e){ throw new Error(/encrypt|password/i.test(e.message||e.name)?'This PDF is password-protected. Remove the password first, then try again.':'This PDF could not be read (damaged or not a PDF).'); }
  log('OCRPDF pages='+pdf.numPages+' lang='+lang);
  $('#progress').textContent=L('Loading the OCR engine (first time: a few MB)...','Memuat mesin OCR (pertama kali: beberapa MB)...');
  await ensureTesseract();
  let current=0;
  const worker=await window.Tesseract.createWorker(lang, 1, {logger:(m)=>{
    if(m.status==='recognizing text'&&typeof m.progress==='number') $('#progress').textContent=L(`OCR page ${current}/${pdf.numPages}... `,`OCR halaman ${current}/${pdf.numPages}... `)+`${Math.round(m.progress*100)}%`;
  }});
  const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  let words=0, scanned=0, hadText=0;
  try{
    for(let i=1;i<=pdf.numPages;i++){
      current=i;
      const page=await pdf.getPage(i);
      // Pages that already carry real text are left untouched.
      const content=await page.getTextContent();
      if(content.items.map(t=>t.str).join('').replace(/\s+/g,'').length>=20){ hadText++; page.cleanup(); continue; }
      $('#progress').textContent=L(`Reading page ${i}/${pdf.numPages}...`,`Membaca halaman ${i}/${pdf.numPages}...`);
      const base=page.getViewport({scale:1});
      // ~290 dpi on A4 for accurate OCR, capped for memory.
      const viewport=page.getViewport({scale:Math.min(4, 2400/Math.max(base.width,base.height))});
      const canvas=document.createElement('canvas');
      canvas.width=Math.ceil(viewport.width); canvas.height=Math.ceil(viewport.height);
      const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      await page.render({canvasContext:ctx, viewport}).promise;
      const result=await worker.recognize(canvas);
      const found=(result.data.words||[]).filter(w=>w.text&&w.text.trim()&&/[A-Za-z0-9]/.test(w.text)&&(w.confidence||0)>=40)
        .map(w=>({text:w.text, x0:w.bbox.x0, y0:w.bbox.y0, x1:w.bbox.x1, y1:w.bbox.y1}));
      const added=PDFOcrLayer.addWords(PDFLib, doc, doc.getPage(i-1), font, found, (x,y)=>viewport.convertToPdfPoint(x,y));
      words+=added; scanned++;
      log(`Page ${i}: ${added} searchable words`);
      page.cleanup(); canvas.width=canvas.height=0;
    }
  } finally { await worker.terminate(); }
  $('#progress').textContent=L('Saving...','Menyimpan...');
  const bytes=await doc.save({useObjectStreams:true});
  downloadBlob(new Blob([bytes],{type:'application/pdf'}), source.name.replace(/\.pdf$/i,'')+'-searchable.pdf');
  const note=document.createElement('p'); note.className='text-center py-2 text-xs text-gray-600';
  note.textContent=!scanned ? '✓ Every page already has selectable text — nothing needed OCR, the PDF is unchanged.'
    : `🔍 ${words} word${words===1?'':'s'} made searchable on ${scanned} scanned page${scanned===1?'':'s'}`
      +(hadText?` · ${hadText} page${hadText===1?'':'s'} already had text (left as is)`:'')
      +(scanned&&!words?' · no readable text was found in the scans':'')+'. The pages look exactly as before.';
  $('#resultPreview').prepend(note);
}
async function htmlToPdf(){
  const file=files[0];
  let caps=null;
  try { caps=await serverCapabilities(); } catch(e) {}
  if(caps && caps.html && !(caps.loginRequired && !caps.token)){
    $('#progress').textContent=L('Printing the page with the browser engine...','Mencetak halaman dengan mesin browser...');
    const response=await fetch('/api/convert/html-to-pdf',{method:'POST',headers:{
      'Content-Type':'text/html','X-Build-Token':caps.token,'X-Filename':encodeURIComponent(file.name),
      'X-Page-Size':$('#opt-paper')?.value||'a4','X-Margin':$('#opt-html-margin')?.value||'12'
    },body:file});
    if(!response.ok){
      let message='HTML conversion failed.';
      try { message=(await response.json()).error||message; } catch(e) {}
      throw new Error(message);
    }
    const blob=await response.blob();
    if(await blob.slice(0,5).text()!=='%PDF-') throw new Error('The server did not return a valid PDF.');
    downloadBlob(new Blob([blob],{type:'application/pdf'}), file.name.replace(/\.html?$/i,'')+'.pdf');
    const note=document.createElement('p'); note.className='text-[11px] leading-relaxed bg-white p-3 rounded border';
    note.textContent=caps.loginRequired
      ? 'Printed with the page layout. For safety on this hosted server, scripts and online images are not loaded — embed images in the file.'
      : 'Printed with the page layout, colours and images, like Print → Save as PDF.';
    $('#resultPreview').prepend(note);
    return;
  }
  // No print engine available: text-only fallback, said plainly.
  const text=await file.text();
  log('HTML size '+text.length+' (text-only fallback)');
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:'mm', format:'a4'});
  const tmp=new DOMParser().parseFromString(text,'text/html');
  const plain=tmp.body?tmp.body.innerText||tmp.body.textContent:'';
  if(!plain.trim()) throw new Error('This HTML file has no text.');
  const lines=pdf.splitTextToSize(plain,170);
  let y=15; pdf.setFontSize(10);
  for(let l of lines){ if(y>280){pdf.addPage(); y=15;} pdf.text(l,15,y); y+=5; }
  downloadBlob(pdf.output('blob'), file.name.replace(/\.html?$/i,'')+'.pdf');
  const note=document.createElement('p'); note.className='text-[11px] leading-relaxed bg-amber-50 p-3 rounded border border-amber-200';
  note.textContent=L('Text only: the full layout, colours and images could not be kept for this file right now.','Hanya teks: tata letak, warna, dan gambar file ini belum bisa dipertahankan saat ini.');
  $('#resultPreview').prepend(note);
}
async function serverCapabilities(){
  const res=await fetch('/api/capabilities');
  if(!res.ok) throw new Error('no-server');
  return res.json();
}
async function convertOfficeToPdf(tool, extensions){
  const file=files[0];
  const ext=file.name.split('.').pop().toLowerCase();
  if(!extensions.includes(ext)) throw new Error('Supported files: '+extensions.map(x=>'.'+x).join(', '));
  let caps;
  try { caps=await serverCapabilities(); } catch(e) {}
  if(!caps) throw new Error(L('Could not reach the MyFlipbook server. Check your connection and reload the page.','Server MyFlipbook tidak terjangkau. Periksa koneksi lalu muat ulang halaman.'));
  if(caps.loginRequired && !caps.token) throw new Error(L('Please log in first to convert Office files.','Masuk dulu untuk mengonversi file Office.'));
  if(!caps.office) throw new Error(L('Office conversion is unavailable right now. Please try again later.','Konversi Office sedang tidak tersedia. Coba lagi nanti.'));
  const types={
    docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',doc:'application/msword',
    xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',xls:'application/vnd.ms-excel',csv:'text/csv',
    pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',ppt:'application/vnd.ms-powerpoint'
  };
  const endpoint=tool==='ppt-to-pdf'?'pptx-to-pdf':tool;
  $('#progress').textContent=L('Converting…','Mengonversi…');
  const response=await fetch('/api/convert/'+endpoint,{method:'POST',headers:{
    'Content-Type':types[ext],'X-Build-Token':caps.token,'X-Filename':encodeURIComponent(file.name)
  },body:file});
  if(!response.ok){
    let message=L('Conversion failed. Please try again.','Konversi gagal. Coba lagi.');
    try { message=(await response.json()).error||message; } catch(e) {}
    throw new Error(message);
  }
  const blob=await response.blob();
  if(await blob.slice(0,5).text()!=='%PDF-') throw new Error('The server did not return a valid PDF.');
  downloadBlob(new Blob([blob],{type:'application/pdf'}),file.name.replace(/\.[^.]+$/,'')+'.pdf');
  const note=document.createElement('p');
  note.className='text-[11px] leading-relaxed bg-white p-3 rounded border';
  note.textContent=L('Converted with LibreOffice using the document layout and print settings. Font substitutions or Office compatibility may affect the result.','Dikonversi dengan LibreOffice memakai tata letak dan pengaturan cetak dokumen. Penggantian font atau kompatibilitas Office bisa memengaruhi hasil.');
  $('#resultPreview').prepend(note);
}
async function pptToPdf(){
  return convertOfficeToPdf('ppt-to-pdf', ['pptx','ppt']);
}
// PptxGenJS 4.0.1 writes an <a:pPr> before every run of a mixed-style line;
// only one is allowed, first in the paragraph, or PowerPoint asks to repair.
function dropExtraParagraphProps(xml){
  return xml.replace(/(<\/a:r>|<a:br\/>)<a:pPr\b[^>]*?(?:\/>|>[\s\S]*?<\/a:pPr>)/g, '$1');
}
async function fixPptxParagraphs(bytes){
  if(!window.JSZip) return bytes;
  const zip=await JSZip.loadAsync(bytes);
  const slides=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n));
  for(const name of slides) zip.file(name, dropExtraParagraphProps(await zip.file(name).async('string')));
  return zip.generateAsync({type:'arraybuffer', compression:'DEFLATE'});
}
async function pdfToPpt(){
  if(!window.pdfjsLib) throw new Error('pdf.js not loaded');
  await ensurePptx();
  const source=files[0];
  const buf=await source.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf, disableWorker: location.protocol==='file:'}).promise;
  log('PDFtoPpt pages='+pdf.numPages);
  const pages=await pdfLayoutPages(pdf, (m)=>{ $('#progress').textContent=m; }, {images:true});
  if(!pages.length) throw new Error('Nothing could be read from this PDF. It may be blank or damaged.');
  const pptx=new window.PptxGenJS();
  // Slide size follows the first page (PowerPoint allows 1–56 in per side).
  let SW=pages[0].width/72, SH=pages[0].height/72;
  const fitSide=Math.max(1/Math.min(SW,SH), 1)*Math.min(1, 56/Math.max(SW,SH));
  SW*=fitSide; SH*=fitSide;
  pptx.defineLayout({name:'PDFPAGES', width:SW, height:SH});
  pptx.layout='PDFPAGES';
  pages.forEach((pg,idx)=>{
    const slide=pptx.addSlide();
    slide.background={color:'FFFFFF'};
    // Contain-fit: whole page visible, nothing cropped or stretched.
    const s=Math.min(SW/(pg.width/72), SH/(pg.height/72));
    const ox=(SW-pg.width/72*s)/2, oy=(SH-pg.height/72*s)/2;
    slide.addImage({data:'image/jpeg;base64,'+pg.background.b64, x:ox, y:oy, w:pg.width/72*s, h:pg.height/72*s});
    // Photos as their own pictures: move, crop or replace them in PowerPoint.
    (pg.images||[]).forEach((im,n)=>{
      slide.addImage({data:`image/${im.type};base64,`+im.b64, x:ox+im.x/72*s, y:oy+im.y/72*s, w:im.w/72*s, h:im.h/72*s, altText:`Picture ${n+1}`});
    });
    pg.runs.forEach(r=>{
      // Mixed styles in one line ("Objective" bold + ": ..." regular) stay mixed.
      const text=r.parts&&r.parts.length>1
        ?r.parts.map(p=>({text:p.text, options:{bold:p.bold, italic:p.italic, color:p.color, fontFace:p.font}}))
        :r.text;
      slide.addText(text, {x:ox+r.x/72*s, y:oy+r.y/72*s, w:Math.min(pg.width-r.x, r.w*1.12+r.size*0.6)/72*s, h:r.h/72*s,
        fontSize:Math.max(1, Math.round(r.size*s*2)/2), fontFace:r.font, color:r.color, bold:r.bold, italic:r.italic,
        margin:0, valign:'top', wrap:false, fit:'none'});
    });
    const notes=pg.runs.length?pg.runs.map(r=>r.text):pg.ocr.map(t=>'[OCR] '+t);
    slide.addNotes(notes.length?notes.join('\n'):'(No editable text on this page — pure artwork.)');
    log(`Slide ${idx+1}: ${pg.runs.length} text boxes, ${(pg.images||[]).length} pictures`);
  });
  $('#progress').textContent=L('Building presentation...','Menyusun presentasi...');
  const presBytes=await fixPptxParagraphs(await pptx.write({outputType:'arraybuffer'}));
  const blob=new Blob([presBytes], {type:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
  $('#progress').textContent=L('Done.','Selesai.');
  downloadBlob(blob, source.name.replace(/\.pdf$/i,'')+'.pptx', {flipbookSource:source});
}

(async ()=>{
